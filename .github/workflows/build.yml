name: Build HD9901 iStoreOS 24.10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout HD9901 project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils \
            rsync unzip zlib1g-dev file wget ccache \
            device-tree-compiler u-boot-tools dosfstools e2fsprogs \
            bc swig python3-setuptools

      - name: Clone iStoreOS 24.10
        run: |
          git clone --depth=1 --branch istoreos-24.10 \
            https://github.com/istoreos/istoreos.git openwrt

      - name: Configure RK3399 NanoPC-T4 build base
        working-directory: openwrt
        run: |
          cat > .config <<'CONFIG'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopc-t4=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=896
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_LUCI_LANG_zh-cn=y
          CONFIG_KERNEL_BUILD_USER="HD9901"
          CONFIG_KERNEL_BUILD_HOST="github-actions"
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_DEBUG_INFO_BTF_MODULES=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_DEBUG_INFO=y
          CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y
          CONFIG_KERNEL_BTF=y
          CONFIG_KERNEL_XZ=y
          CONFIG_TARGET_INITRAMFS_COMPRESSION_XZ=y
          CONFIG'
          make defconfig

      - name: Compile Linux kernel and device trees
        working-directory: openwrt
        run: |
          make target/linux/compile -j$(nproc) V=s

      - name: Replace generated NanoPC-T4 DTB with HD9901 DTB
        working-directory: openwrt
        run: |
          set -eux
          mapfile -t DTBS < <(find build_dir -type f -name 'image-rk3399-nanopc-t4.dtb')
          test "${#DTBS[@]}" -ge 1

          for dtb in "${DTBS[@]}"; do
            echo "Replacing $dtb"
            cp "$GITHUB_WORKSPACE/hd9901/hd9901.dtb" "$dtb"
            file "$dtb"
            sha256sum "$dtb"
          done

      - name: Build iStoreOS image
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s

      - name: Locate generated image
        run: |
          set -eux

          find openwrt/bin/targets -maxdepth 5 -type f | sort | tee /tmp/images.txt

          IMG_GZ=$(find openwrt/bin/targets \
            -type f \
            -name '*sysupgrade.img.gz' \
            | head -n1)

          if [ -z "$IMG_GZ" ]; then
            IMG_GZ=$(find openwrt/bin/targets \
              -type f \
              -name '*.img.gz' \
              | head -n1)
          fi

          test -n "$IMG_GZ"

          echo "IMG_GZ=$IMG_GZ" >> "$GITHUB_ENV"

      - name: Rebuild the known-good HD9901 boot area
        run: |
          set -eux

          mkdir -p output

          cat hd9901/old-boot-area.part* > /tmp/old-boot-area.bin

          test "$(stat -c %s /tmp/old-boot-area.bin)" -eq 33554432

          gzip -dc "$IMG_GZ" > /tmp/new.img

          cp /tmp/new.img output/HD9901-iStoreOS-24.10.img

          dd \
            if=/tmp/old-boot-area.bin \
            of=output/HD9901-iStoreOS-24.10.img \
            bs=512 \
            skip=1 \
            seek=1 \
            count=65535 \
            conv=notrunc \
            status=progress

          gzip -9 -c \
            output/HD9901-iStoreOS-24.10.img \
            > output/HD9901-iStoreOS-24.10-final.img.gz

          cd output

          sha256sum \
            HD9901-iStoreOS-24.10.img \
            > HD9901-iStoreOS-24.10.img.sha256

          sha256sum \
            HD9901-iStoreOS-24.10-final.img.gz \
            > HD9901-iStoreOS-24.10-final.img.gz.sha256

          zip -9 HD9901-iStoreOS-24.10-final.zip \
            HD9901-iStoreOS-24.10.img \
            HD9901-iStoreOS-24.10-final.img.gz \
            HD9901-iStoreOS-24.10.img.sha256 \
            HD9901-iStoreOS-24.10-final.img.gz.sha256

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HD9901-iStoreOS-24.10-final
          path: output/*
          retention-days: 30
