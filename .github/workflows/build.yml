name: Build HD9901 iStoreOS 24.10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: HD9901 iStoreOS 24.10 Build
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ISTOREOS_BRANCH: istoreos-24.10
      BUILD_JOBS: 2

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout HD9901 repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. 检查 HD9901 文件
      # ==========================================================
      - name: Check HD9901 files
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "HD9901 repository"
          echo "======================================"

          find hd9901 \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "Checking required files..."

          test -f hd9901/hd9901.dtb
          test -f hd9901/hd9901.dts
          test -f hd9901/old-boot-area.part00
          test -f hd9901/old-boot-area.part01

          echo
          echo "======================================"
          echo "Original DTB"
          echo "======================================"

          file hd9901/hd9901.dtb

          echo
          echo "DTB SHA256:"
          sha256sum hd9901/hd9901.dtb

          echo
          echo "======================================"
          echo "Original DTS"
          echo "======================================"

          ls -lh hd9901/hd9901.dts

          echo
          echo "DTS SHA256:"
          sha256sum hd9901/hd9901.dts

          echo
          echo "======================================"
          echo "Original boot area"
          echo "======================================"

          ls -lh \
            hd9901/old-boot-area.part00 \
            hd9901/old-boot-area.part01

          echo
          echo "======================================"
          echo "Git information"
          echo "======================================"

          git log -1 --oneline

      # ==========================================================
      # 3. 安装编译依赖
      # ==========================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            libfdt-dev \
            libpython3-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            rsync \
            unzip \
            zip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ccache \
            device-tree-compiler \
            u-boot-tools \
            dosfstools \
            e2fsprogs \
            bc \
            swig \
            xsltproc \
            patch \
            perl \
            subversion \
            gperf \
            qemu-utils \
            time

      # ==========================================================
      # 4. Python 工具
      # ==========================================================
      - name: Install Python tools
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m pip install \
            --upgrade \
            --user \
            setuptools \
            wheel \
            pyelftools

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          python3 -c \
            "from elftools.elf.elffile import ELFFile; print('pyelftools OK')"

      # ==========================================================
      # 5. 检查编译环境
      #
      # 注意：
      # 不使用 xxx | head -n 1
      # 避免 set -o pipefail 触发 stdout/SIGPIPE 错误
      # ==========================================================
      - name: Check build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "CPU"
          echo "======================================"

          nproc

          echo
          echo "======================================"
          echo "Memory"
          echo "======================================"

          free -h

          echo
          echo "======================================"
          echo "Disk"
          echo "======================================"

          df -h

          echo
          echo "======================================"
          echo "GCC"
          echo "======================================"

          gcc --version

          echo
          echo "======================================"
          echo "MAKE"
          echo "======================================"

          make --version

          echo
          echo "======================================"
          echo "PYTHON"
          echo "======================================"

          python3 --version

          echo
          echo "======================================"
          echo "DTC"
          echo "======================================"

          dtc --version

          echo
          echo "======================================"
          echo "MKIMAGE"
          echo "======================================"

          mkimage -V

          echo
          echo "======================================"
          echo "FLEX"
          echo "======================================"

          flex --version

          echo
          echo "======================================"
          echo "BISON"
          echo "======================================"

          bison --version

      # ==========================================================
      # 6. Clone iStoreOS 24.10
      # ==========================================================
      - name: Clone iStoreOS 24.10
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${ISTOREOS_BRANCH}" \
            https://github.com/istoreos/istoreos.git \
            openwrt

          cd openwrt

          echo
          echo "======================================"
          echo "iStoreOS version"
          echo "======================================"

          git log -1 --oneline

          echo
          echo "Branch:"
          git branch --show-current

      # ==========================================================
      # 7. 备份原始 HD9901 文件
      # ==========================================================
      - name: Backup original HD9901 files
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf hd9901-backup

          mkdir -p hd9901-backup

          cp \
            hd9901/hd9901.dtb \
            hd9901-backup/

          cp \
            hd9901/hd9901.dts \
            hd9901-backup/

          cp \
            hd9901/old-boot-area.part00 \
            hd9901-backup/

          cp \
            hd9901/old-boot-area.part01 \
            hd9901-backup/

          if [ -f hd9901/SOURCE-HASHES.txt ]; then
            cp \
              hd9901/SOURCE-HASHES.txt \
              hd9901-backup/
          fi

          echo
          echo "Backup files:"
          find hd9901-backup \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      # ==========================================================
      # 8. 查找 NanoPC-T4 DTS
      # ==========================================================
      - name: Locate RK3399 NanoPC-T4 DTS
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Searching NanoPC-T4 DTS"
          echo "======================================"

          find openwrt/target/linux/rockchip \
            -type f \
            \( \
              -name 'rk3399-nanopc-t4.dts' \
              -o \
              -name 'rk3399-nanopc-t4.dtsi' \
            \) \
            -print

          echo
          echo "Searching all RK3399 DTS:"
          find openwrt/target/linux/rockchip \
            -type f \
            -name 'rk3399*.dts' \
            -print \
            | sort

      # ==========================================================
      # 9. 安装 HD9901 DTS
      #
      # 重要：
      # 在 Linux kernel prepare/compile 之前替换
      # 不再编译完成以后才替换 DTB
      # ==========================================================
      - name: Install HD9901 DTS
        shell: bash
        run: |
          set -euxo pipefail

          SOURCE_DTS="$GITHUB_WORKSPACE/hd9901/hd9901.dts"

          test -f "$SOURCE_DTS"

          TARGET_DTS="openwrt/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3399-nanopc-t4.dts"

          if [ ! -f "$TARGET_DTS" ]; then
            echo
            echo "ERROR: NanoPC-T4 DTS not found:"
            echo "$TARGET_DTS"
            echo
            echo "Available DTS files:"
            find openwrt/target/linux/rockchip \
              -type f \
              -name '*.dts' \
              -print \
              | sort
            exit 1
          fi

          echo "======================================"
          echo "Original target DTS"
          echo "======================================"

          ls -lh "$TARGET_DTS"

          cp \
            "$TARGET_DTS" \
            "${TARGET_DTS}.original"

          echo
          echo "======================================"
          echo "Installing HD9901 DTS"
          echo "======================================"

          cp \
            "$SOURCE_DTS" \
            "$TARGET_DTS"

          echo
          echo "Installed DTS:"
          ls -lh "$TARGET_DTS"

          echo
          echo "DTS SHA256:"
          sha256sum "$TARGET_DTS"

      # ==========================================================
      # 10. 检查 HD9901 DTS
      # ==========================================================
      - name: Validate HD9901 DTS
        shell: bash
        run: |
          set -euxo pipefail

          DTS="openwrt/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3399-nanopc-t4.dts"

          test -f "$DTS"

          echo "======================================"
          echo "HD9901 DTS validation"
          echo "======================================"

          echo
          echo "Line count:"
          wc -l "$DTS"

          echo
          echo "RK3399 compatible:"
          grep -n \
            'rockchip,rk3399' \
            "$DTS" \
            || true

          echo
          echo "GMAC:"
          grep -n \
            'rk3399-gmac\|phy-mode.*rgmii' \
            "$DTS" \
            || true

          echo
          echo "eMMC:"
          grep -n \
            'sdhci@fe330000\|mmc-hs400' \
            "$DTS" \
            || true

          echo
          echo "USB:"
          grep -n \
            'fe800000\|fe900000' \
            "$DTS" \
            || true

          echo
          echo "PCIe:"
          grep -n \
            'pcie@f8000000' \
            "$DTS" \
            || true

          echo
          echo "WiFi:"
          grep -n \
            'ap6255\|wireless-wlan' \
            "$DTS" \
            || true

          echo
          echo "Bluetooth:"
          grep -n \
            'wireless-bluetooth' \
            "$DTS" \
            || true

      # ==========================================================
      # 11. 检查 DTS 是否可以被 DTC 解析
      # ==========================================================
      - name: Check DTS syntax
        shell: bash
        run: |
          set -euxo pipefail

          DTS="$GITHUB_WORKSPACE/hd9901/hd9901.dts"

          echo "Checking DTS syntax..."

          mkdir -p dts-check

          dtc \
            -I dts \
            -O dtb \
            -o dts-check/hd9901-test.dtb \
            "$DTS"

          file dts-check/hd9901-test.dtb

          sha256sum dts-check/hd9901-test.dtb

      # ==========================================================
      # 12. 配置 iStoreOS
      # ==========================================================
      - name: Configure iStoreOS
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          rm -f .config

          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopc-t4=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_IMAGES_GZIP=y

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=896

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_LUCI_LANG_zh-cn=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_ca-bundle=y

          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_pciutils=y

          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y

          CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
          CONFIG_PACKAGE_ethtool=y

          CONFIG_KERNEL_BUILD_USER="HD9901"
          CONFIG_KERNEL_BUILD_HOST="github-actions"

          EOF

          echo
          echo "======================================"
          echo "Running make defconfig"
          echo "======================================"

          make defconfig

          echo
          echo "======================================"
          echo "Target configuration"
          echo "======================================"

          grep \
            -E \
            'CONFIG_TARGET_rockchip|CONFIG_TARGET_ROOTFS|CONFIG_TARGET_KERNEL_PARTSIZE|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_LINUX_' \
            .config \
            | sort

      # ==========================================================
      # 13. 确认目标设备
      # ==========================================================
      - name: Verify target profile
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Target profile"
          echo "======================================"

          grep \
            'CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopc-t4' \
            .config

          echo
          echo "Linux DTS source has been replaced by HD9901 DTS."

      # ==========================================================
      # 14. OpenWrt prerequisite
      # ==========================================================
      - name: Check OpenWrt prerequisites
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make prereq V=s

      # ==========================================================
      # 15. 更新 feeds
      # ==========================================================
      - name: Update feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ==========================================================
      # 16. 重新生成配置
      # ==========================================================
      - name: Re-run defconfig
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make defconfig

      # ==========================================================
      # 17. 下载源码包
      # ==========================================================
      - name: Download package sources
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make download \
            -j${BUILD_JOBS} \
            V=s

      # ==========================================================
      # 18. 准备 Linux kernel
      # ==========================================================
      - name: Prepare Linux kernel
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make target/linux/prepare \
            -j${BUILD_JOBS} \
            V=s

      # ==========================================================
      # 19. 查找 kernel DTS
      # ==========================================================
      - name: Find prepared HD9901 DTS
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Searching prepared DTS"
          echo "======================================"

          find build_dir \
            -type f \
            -name 'rk3399-nanopc-t4.dts' \
            -print \
            | sort

          echo
          echo "Checking for HD9901 compatible..."

          FOUND=0

          while IFS= read -r DTS; do

            echo
            echo "Checking:"
            echo "$DTS"

            if grep -q 'rockchip,rk3399-mid' "$DTS"; then
              echo "HD9901 DTS detected!"
              FOUND=1
              break
            fi

          done < <(
            find build_dir \
              -type f \
              -name 'rk3399-nanopc-t4.dts'
          )

          if [ "$FOUND" -ne 1 ]; then
            echo
            echo "ERROR:"
            echo "HD9901 DTS was not found in prepared kernel source."

            echo
            echo "DTS files:"
            find build_dir \
              -type f \
              -name '*.dts' \
              -print \
              | sort \
              | head -n 100

            exit 1
          fi

      # ==========================================================
      # 20. 编译 Linux kernel
      #
      # 固定 -j2
      # 防止之前出现 flex/m4 并发问题
      # ==========================================================
      - name: Compile Linux kernel
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make target/linux/compile \
            -j${BUILD_JOBS} \
            V=s

      # ==========================================================
      # 21. 检查生成 DTB
      # ==========================================================
      - name: Verify generated HD9901 DTB
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Generated DTB files"
          echo "======================================"

          find build_dir \
            -type f \
            -name '*.dtb' \
            -print \
            | sort

          echo
          echo "Searching NanoPC-T4 DTB..."

          DTB=""

          while IFS= read -r FILE; do
            DTB="$FILE"
            break
          done < <(
            find build_dir \
              -type f \
              -name 'image-rk3399-nanopc-t4.dtb'
          )

          if [ -z "$DTB" ]; then
            echo
            echo "ERROR: Generated DTB not found."

            echo
            echo "All DTB files:"
            find build_dir \
              -type f \
              -name '*.dtb' \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "Selected DTB:"
          echo "$DTB"

          echo
          echo "File:"
          file "$DTB"

          echo
          echo "SHA256:"
          sha256sum "$DTB"

          echo
          echo "Checking compatible..."

          dtc \
            -I dtb \
            -O dts \
            "$DTB" \
            > /tmp/generated.dts

          grep \
            -n \
            'rockchip,rk3399' \
            /tmp/generated.dts \
            || true

      # ==========================================================
      # 22. 完整编译 iStoreOS
      # ==========================================================
      - name: Build iStoreOS firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make \
            -j${BUILD_JOBS} \
            V=s

      # ==========================================================
      # 23. 显示编译结果
      # ==========================================================
      - name: List firmware output
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Firmware output"
          echo "======================================"

          find openwrt/bin/targets \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

      # ==========================================================
      # 24. 创建 output
      # ==========================================================
      - name: Prepare output
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf output

          mkdir -p output

      # ==========================================================
      # 25. 查找最终镜像
      # ==========================================================
      - name: Find final firmware image
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Searching firmware images"
          echo "======================================"

          find openwrt/bin/targets \
            -type f \
            \( \
              -name '*.img' \
              -o \
              -name '*.img.gz' \
              -o \
              -name '*.tar.gz' \
            \) \
            -print \
            | sort

          echo
          echo "Searching sysupgrade image..."

          IMG_GZ=""

          while IFS= read -r FILE; do
            IMG_GZ="$FILE"
            break
          done < <(
            find openwrt/bin/targets \
              -type f \
              -name '*sysupgrade.img.gz'
          )

          if [ -z "$IMG_GZ" ]; then

            echo
            echo "sysupgrade.img.gz not found."
            echo "Searching generic img.gz..."

            while IFS= read -r FILE; do
              IMG_GZ="$FILE"
              break
            done < <(
              find openwrt/bin/targets \
                -type f \
                -name '*.img.gz'
            )

          fi

          if [ -z "$IMG_GZ" ]; then
            echo
            echo "ERROR: No IMG.GZ firmware found."
            exit 1
          fi

          echo
          echo "Selected firmware:"
          echo "$IMG_GZ"

          cp \
            "$IMG_GZ" \
            output/HD9901-iStoreOS-24.10.img.gz

          echo "IMG_GZ=$IMG_GZ" >> "$GITHUB_ENV"

      # ==========================================================
      # 26. 解压镜像
      # ==========================================================
      - name: Extract firmware image
        shell: bash
        run: |
          set -euxo pipefail

          gzip -dc \
            output/HD9901-iStoreOS-24.10.img.gz \
            > \
            output/HD9901-iStoreOS-24.10.img

          echo
          echo "Image size:"
          ls -lh \
            output/HD9901-iStoreOS-24.10.img

          echo
          echo "Image type:"
          file \
            output/HD9901-iStoreOS-24.10.img

      # ==========================================================
      # 27. 导出原始 HD9901 DTB
      # ==========================================================
      - name: Export original HD9901 DTB
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            hd9901/hd9901.dtb \
            output/HD9901-original.dtb

          file \
            output/HD9901-original.dtb

          sha256sum \
            output/HD9901-original.dtb

      # ==========================================================
      # 28. 导出原始 HD9901 DTS
      # ==========================================================
      - name: Export original HD9901 DTS
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            hd9901/hd9901.dts \
            output/HD9901-original.dts

          ls -lh \
            output/HD9901-original.dts

      # ==========================================================
      # 29. 导出原始 boot area
      # ==========================================================
      - name: Export original HD9901 boot area
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            hd9901/old-boot-area.part00 \
            output/HD9901-old-boot-area.part00

          cp \
            hd9901/old-boot-area.part01 \
            output/HD9901-old-boot-area.part01

          if [ -f hd9901/SOURCE-HASHES.txt ]; then
            cp \
              hd9901/SOURCE-HASHES.txt \
              output/SOURCE-HASHES.txt
          fi

          echo
          echo "Boot area files:"
          ls -lh \
            output/HD9901-old-boot-area.part00 \
            output/HD9901-old-boot-area.part01

      # ==========================================================
      # 30. 导出编译后的 DTB
      # ==========================================================
      - name: Export compiled HD9901 DTB
        shell: bash
        run: |
          set -euxo pipefail

          DTB=""

          while IFS= read -r FILE; do
            DTB="$FILE"
            break
          done < <(
            find openwrt/build_dir \
              -type f \
              -name 'image-rk3399-nanopc-t4.dtb'
          )

          if [ -z "$DTB" ]; then
            echo "ERROR: Compiled DTB not found."
            exit 1
          fi

          cp \
            "$DTB" \
            output/HD9901-linux-6.6.dtb

          echo
          echo "Compiled HD9901 DTB:"
          ls -lh \
            output/HD9901-linux-6.6.dtb

          echo
          echo "File:"
          file \
            output/HD9901-linux-6.6.dtb

          echo
          echo "SHA256:"
          sha256sum \
            output/HD9901-linux-6.6.dtb

      # ==========================================================
      # 31. 创建原始 boot area 备份 ZIP
      # ==========================================================
      - name: Create original boot backup ZIP
        shell: bash
        run: |
          set -euxo pipefail

          cd output

          zip -9 \
            HD9901-original-boot-backup.zip \
            HD9901-old-boot-area.part00 \
            HD9901-old-boot-area.part01 \
            HD9901-original.dtb \
            HD9901-original.dts

      # ==========================================================
      # 32. SHA256
      # ==========================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -euxo pipefail

          cd output

          sha256sum \
            HD9901-iStoreOS-24.10.img \
            > \
            HD9901-iStoreOS-24.10.img.sha256

          sha256sum \
            HD9901-iStoreOS-24.10.img.gz \
            > \
            HD9901-iStoreOS-24.10.img.gz.sha256

          sha256sum \
            HD9901-linux-6.6.dtb \
            > \
            HD9901-linux-6.6.dtb.sha256

          echo
          echo "======================================"
          echo "SHA256"
          echo "======================================"

          cat *.sha256

      # ==========================================================
      # 33. 创建最终 ZIP
      # ==========================================================
      - name: Create HD9901 firmware ZIP
        shell: bash
        run: |
          set -euxo pipefail

          cd output

          zip -9 \
            HD9901-iStoreOS-24.10.zip \
            HD9901-iStoreOS-24.10.img \
            HD9901-iStoreOS-24.10.img.gz \
            HD9901-iStoreOS-24.10.img.sha256 \
            HD9901-iStoreOS-24.10.img.gz.sha256 \
            HD9901-linux-6.6.dtb \
            HD9901-linux-6.6.dtb.sha256 \
            HD9901-original.dtb \
            HD9901-original.dts \
            HD9901-old-boot-area.part00 \
            HD9901-old-boot-area.part01 \
            HD9901-original-boot-backup.zip

          if [ -f SOURCE-HASHES.txt ]; then
            zip -9 \
              HD9901-iStoreOS-24.10.zip \
              SOURCE-HASHES.txt
          fi

          echo
          echo "Final ZIP:"
          ls -lh \
            HD9901-iStoreOS-24.10.zip

      # ==========================================================
      # 34. 最终检查
      # ==========================================================
      - name: Final check
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "======================================"
          echo "HD9901 BUILD COMPLETE"
          echo "======================================"

          echo
          echo "Output:"
          ls -lh output/

          echo
          echo "======================================"
          echo "Firmware"
          echo "======================================"

          file \
            output/HD9901-iStoreOS-24.10.img \
            output/HD9901-iStoreOS-24.10.img.gz

          echo
          echo "======================================"
          echo "Compiled DTB"
          echo "======================================"

          file \
            output/HD9901-linux-6.6.dtb

          echo
          echo "======================================"
          echo "SHA256"
          echo "======================================"

          cat output/*.sha256

      # ==========================================================
      # 35. 上传 Actions Artifacts
      # ==========================================================
      - name: Upload HD9901 firmware
        uses: actions/upload-artifact@v4
        with:
          name: HD9901-iStoreOS-24.10
          path: output/*
          if-no-files-found: error
          retention-days: 30
