name: Build HD9901 iStoreOS 24.10 - RK3399

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:

      # ==========================================
      # 1. 获取本仓库文件
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. 安装编译环境
      # ==========================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pyelftools \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            ccache \
            device-tree-compiler \
            u-boot-tools \
            dosfstools \
            e2fsprogs \
            bc \
            swig \
            time


      # ==========================================
      # 3. 下载 iStoreOS 24.10 源码
      # ==========================================
      - name: Clone iStoreOS 24.10
        run: |
          git clone \
            --depth=1 \
            --branch istoreos-24.10 \
            https://github.com/istoreos/istoreos.git \
            openwrt


      # ==========================================
      # 4. 配置 iStoreOS
      # ==========================================
      - name: Configure iStoreOS
        working-directory: openwrt
        run: |

          cat > .config <<'EOF'

          # ==========================================
          # Target
          # ==========================================

          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopc-t4=y


          # ==========================================
          # Filesystem
          # ==========================================

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y


          # ==========================================
          # iStoreOS
          # ==========================================

          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y


          # ==========================================
          # Kernel build information
          # ==========================================

          CONFIG_KERNEL_BUILD_USER="iStoreOS"
          CONFIG_KERNEL_BUILD_DOMAIN="iStoreOS"


          # ==========================================
          # RootFS / Kernel partition sizes
          # ==========================================

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=256


          # ==========================================
          # Development
          # ==========================================

          CONFIG_DEVEL=y

          EOF

          make defconfig


      # ==========================================
      # 5. 编译 Linux 内核和设备树
      # ==========================================
      - name: Compile Linux kernel and device trees
        working-directory: openwrt
        run: |
          make target/linux/compile -j2 V=s


      # ==========================================
      # 6. 替换为 HD9901 DTB
      # ==========================================
      - name: Replace NanoPC-T4 DTB with HD9901 DTB
        working-directory: openwrt
        run: |

          set -eux

          DTB="$GITHUB_WORKSPACE/hd9901/hd9901.dtb"

          echo "Checking HD9901 DTB..."

          if [ ! -f "$DTB" ]; then
            echo "ERROR: HD9901 DTB not found!"
            exit 1
          fi

          echo "HD9901 DTB:"
          ls -lh "$DTB"
          file "$DTB"

          echo "Searching NanoPC-T4 DTB..."

          FOUND=0

          while IFS= read -r f
          do
            echo "Replacing:"
            echo "$f"

            cp "$DTB" "$f"

            FOUND=1

          done < <(
            find build_dir \
              -type f \
              -name 'image-rk3399-nanopc-t4.dtb'
          )

          if [ "$FOUND" -eq 0 ]; then

            echo "ERROR: NanoPC-T4 DTB was not found!"

            echo "Available DTB files:"

            find build_dir \
              -type f \
              -name '*.dtb' \
              | head -100

            exit 1

          fi

          echo "HD9901 DTB replacement completed."


      # ==========================================
      # 7. 编译完整 iStoreOS 固件
      # ==========================================
      - name: Build iStoreOS image
        working-directory: openwrt
        run: |
          make -j2 V=s


      # ==========================================
      # 8. 找到并处理固件
      # ==========================================
      - name: Prepare final HD9901 image
        working-directory: openwrt
        run: |

          set -eux

          mkdir -p output

          echo "=========================================="
          echo "Searching generated firmware..."
          echo "=========================================="

          find bin/targets \
            -type f \
            \( \
              -name '*.img.gz' \
              -o \
              -name '*sysupgrade*.gz' \
            \) \
            -print


          IMAGE_GZ=$(
            find bin/targets \
              -type f \
              \( \
                -name '*.img.gz' \
                -o \
                -name '*sysupgrade*.gz' \
              \) \
              | head -n 1
          )


          if [ -z "$IMAGE_GZ" ]; then

            echo "ERROR: No firmware image found!"

            echo "All generated files:"

            find bin/targets \
              -type f \
              | sort

            exit
