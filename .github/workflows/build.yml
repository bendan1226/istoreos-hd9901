name: Build HD9901 iStoreOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: HD9901 iStoreOS Build
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. 检查 HD9901 文件
      # ==========================================================
      - name: Check HD9901 files
        run: |
          set -eux

          echo "======================================"
          echo "HD9901 files"
          echo "======================================"

          find hd9901 -maxdepth 2 -type f -print

          test -f hd9901/hd9901.dtb
          test -f hd9901/old-boot-area.part00
          test -f hd9901/old-boot-area.part01

          echo
          echo "DTB:"
          file hd9901/hd9901.dtb

          echo
          echo "SHA256:"
          sha256sum hd9901/hd9901.dtb

          echo
          echo "Boot area:"
          ls -lh hd9901/old-boot-area.part00
          ls -lh hd9901/old-boot-area.part01

      # ==========================================================
      # 3. 安装编译环境
      # ==========================================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            rsync \
            unzip \
            zip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ccache \
            device-tree-compiler \
            u-boot-tools \
            dosfstools \
            e2fsprogs \
            bc \
            swig \
            xsltproc \
            libelf-dev \
            libfdt-dev \
            libpython3-dev \
            time

      # ==========================================================
      # 4. 安装 Python ELF 工具
      # ==========================================================
      - name: Install Python packages
        run: |
          set -eux

          python3 -m pip install \
            --upgrade \
            --user \
            pip \
            setuptools \
            wheel \
            pyelftools

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          python3 -c \
            "from elftools.elf.elffile import ELFFile; print('pyelftools OK')"

      # ==========================================================
      # 5. 检查工具链
      # ==========================================================
      - name: Check build environment
        run: |
          set -eux

          echo "======================================"
          echo "Python"
          echo "======================================"

          python3 --version

          echo
          echo "======================================"
          echo "pyelftools"
          echo "======================================"

          python3 -c \
            "import elftools; print(elftools.__file__)"

          python3 -c \
            "from elftools.elf.elffile import ELFFile; print('ELFFile OK')"

          echo
          echo "======================================"
          echo "DTC"
          echo "======================================"

          dtc --version

          echo
          echo "======================================"
          echo "mkimage"
          echo "======================================"

          mkimage -V

          echo
          echo "======================================"
          echo "GCC"
          echo "======================================"

          gcc --version

      # ==========================================================
      # 6. Clone iStoreOS 24.10
      # ==========================================================
      - name: Clone iStoreOS
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch istoreos-24.10 \
            https://github.com/istoreos/istoreos.git \
            openwrt

          cd openwrt

          echo
          echo "======================================"
          echo "iStoreOS version"
          echo "======================================"

          git log -1 --oneline

          echo
          echo "Branch:"
          git branch --show-current

      # ==========================================================
      # 7. 保存 HD9901 DTB
      # ==========================================================
      - name: Backup HD9901 DTB
        run: |
          set -eux

          mkdir -p hd9901-backup

          cp \
            hd9901/hd9901.dtb \
            hd9901-backup/hd9901.dtb

          cp \
            hd9901/old-boot-area.part00 \
            hd9901-backup/old-boot-area.part00

          cp \
            hd9901/old-boot-area.part01 \
            hd9901-backup/old-boot-area.part01

      # ==========================================================
      # 8. 配置 NanoPC-T4 / RK3399
      # ==========================================================
      - name: Configure iStoreOS
        working-directory: openwrt
        run: |
          set -eux

          rm -f .config

          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopc-t4=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_IMAGES_GZIP=y

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=896

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_LUCI_LANG_zh-cn=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_ca-bundle=y

          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_pciutils=y

          CONFIG_KERNEL_XZ=y

          CONFIG_KERNEL_BUILD_USER="HD9901"
          CONFIG_KERNEL_BUILD_HOST="github-actions"

          EOF

          make defconfig

          echo
          echo "======================================"
          echo "Final configuration"
          echo "======================================"

          grep \
            -E \
            'CONFIG_TARGET_rockchip|CONFIG_TARGET_ROOTFS|CONFIG_TARGET_KERNEL_PARTSIZE|CONFIG_TARGET_ROOTFS_PARTSIZE' \
            .config

      # ==========================================================
      # 9. OpenWrt prerequisite
      # ==========================================================
      - name: Check OpenWrt prerequisites
        working-directory: openwrt
        run: |
          set -eux

          make prereq V=s

      # ==========================================================
      # 10. 下载源码包
      # ==========================================================
      - name: Download package sources
        working-directory: openwrt
        run: |
          set -eux

          make download \
            -j$(nproc) \
            V=s

      # ==========================================================
      # 11. 编译 target/linux
      # ==========================================================
      - name: Compile Linux kernel
        working-directory: openwrt
        run: |
          set -eux

          make target/linux/compile \
            -j$(nproc) \
            V=s

      # ==========================================================
      # 12. 查找 RK3399 DTB
      # ==========================================================
      - name: Find RK3399 DTB
        working-directory: openwrt
        run: |
          set -eux

          echo "======================================"
          echo "Searching DTB"
          echo "======================================"

          find build_dir \
            -type f \
            -name '*.dtb' \
            -print

      # ==========================================================
      # 13. 安装 HD9901 DTB
      # ==========================================================
      - name: Install HD9901 DTB
        working-directory: openwrt
        run: |
          set -eux

          SOURCE_DTB="$GITHUB_WORKSPACE/hd9901/hd9901.dtb"

          test -f "$SOURCE_DTB"

          echo "Source DTB:"
          file "$SOURCE_DTB"

          echo
          echo "Searching NanoPC-T4 DTB..."

          mapfile -t DTB_FILES < <(
            find build_dir \
              -type f \
              \( \
                -name '*nanopc-t4*.dtb' \
                -o \
                -name '*nanopc_t4*.dtb' \
              \)
          )

          echo "Found DTB count:"
          echo "${#DTB_FILES[@]}"

          if [ "${#DTB_FILES[@]}" -eq 0 ]; then
            echo "ERROR: NanoPC-T4 DTB not found!"
            exit 1
          fi

          for DTB in "${DTB_FILES[@]}"; do

            echo
            echo "Replacing:"
            echo "$DTB"

            cp \
              "$SOURCE_DTB" \
              "$DTB"

            echo "Installed:"
            file "$DTB"

          done

      # ==========================================================
      # 14. 重新执行 kernel compile
      # ==========================================================
      - name: Rebuild Linux kernel
        working-directory: openwrt
        run: |
          set -eux

          make target/linux/compile \
            -j$(nproc) \
            V=s

      # ==========================================================
      # 15. 编译完整固件
      # ==========================================================
      - name: Build iStoreOS
        working-directory: openwrt
        run: |
          set -eux

          make \
            -j$(nproc) \
            V=s

      # ==========================================================
      # 16. 显示编译结果
      # ==========================================================
      - name: List firmware
        run: |
          set -eux

          echo "======================================"
          echo "Firmware files"
          echo "======================================"

          find openwrt/bin/targets \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

      # ==========================================================
      # 17. 创建输出目录
      # ==========================================================
      - name: Prepare output
        run: |
          set -eux

          mkdir -p output

      # ==========================================================
      # 18. 查找最终镜像
      # ==========================================================
      - name: Find final image
        run: |
          set -eux

          echo "Searching image..."

          find openwrt/bin/targets \
            -type f \
            \( \
              -name '*.img' \
              -o \
              -name '*.img.gz' \
            \) \
            -print

          IMG_GZ=$(
            find openwrt/bin/targets \
              -type f \
              -name '*sysupgrade.img.gz' \
              | head -n 1
          )

          if [ -z "$IMG_GZ" ]; then
            IMG_GZ=$(
              find openwrt/bin/targets \
                -type f \
                -name '*.img.gz' \
                | head -n 1
            )
          fi

          if [ -z "$IMG_GZ" ]; then
            echo "ERROR: Firmware image not found!"
            exit 1
          fi

          echo "Selected:"
          echo "$IMG_GZ"

          cp \
            "$IMG_GZ" \
            output/HD9901-iStoreOS-24.10.img.gz

          echo "IMG_GZ=$IMG_GZ" >> "$GITHUB_ENV"

      # ==========================================================
      # 19. 解压镜像
      # ==========================================================
      - name: Extract image
        run: |
          set -eux

          gzip -dc \
            output/HD9901-iStoreOS-24.10.img.gz \
            > \
            output/HD9901-iStoreOS-24.10.img

          echo
          echo "Image information:"
          ls -lh output/HD9901-iStoreOS-24.10.img

          file \
            output/HD9901-iStoreOS-24.10.img

      # ==========================================================
      # 20. 检查旧 boot area
      # ==========================================================
      - name: Check HD9901 boot area
        run: |
          set -eux

          echo "======================================"
          echo "HD9901 boot area"
          echo "======================================"

          ls -lh \
            hd9901/old-boot-area.part00 \
            hd9901/old-boot-area.part01

          SIZE0=$(stat -c%s hd9901/old-boot-area.part00)
          SIZE1=$(stat -c%s hd9901/old-boot-area.part01)

          echo "part00 = $SIZE0"
          echo "part01 = $SIZE1"

          TOTAL=$((SIZE0 + SIZE1))

          echo "Total = $TOTAL bytes"

      # ==========================================================
      # 21. 备份最终镜像
      # ==========================================================
      - name: Create raw firmware backup
        run: |
          set -eux

          cp \
            output/HD9901-iStoreOS-24.10.img \
            output/HD9901-iStoreOS-24.10-raw.img

      # ==========================================================
      # 22. SHA256
      # ==========================================================
      - name: Generate SHA256
        run: |
          set -eux

          sha256sum \
            output/HD9901-iStoreOS-24.10.img \
            > \
            output/HD9901-iStoreOS-24.10.img.sha256

          sha256sum \
            output/HD9901-iStoreOS-24.10.img.gz \
            > \
            output/HD9901-iStoreOS-24.10.img.gz.sha256

      # ==========================================================
      # 23. 创建 ZIP
      # ==========================================================
      - name: Create ZIP package
        run: |
          set -eux

          cd output

          zip -9 \
            HD9901-iStoreOS-24.10.zip \
            HD9901-iStoreOS-24.10.img \
            HD9901-iStoreOS-24.10.img.gz \
            HD9901-iStoreOS-24.10.img.sha256 \
            HD9901-iStoreOS-24.10.img.gz.sha256

      # ==========================================================
      # 24. 显示最终文件
      # ==========================================================
      - name: Final check
        run: |
          set -eux

          echo
          echo "======================================"
          echo "BUILD COMPLETE"
          echo "======================================"

          ls -lh output/

          echo
          echo "SHA256:"
          cat output/*.sha256

      # ==========================================================
      # 25. 上传 Actions Artifacts
      # ==========================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: HD9901-iStoreOS-24.10
          path: output/*
          if-no-files-found: error
          retention-days: 30
