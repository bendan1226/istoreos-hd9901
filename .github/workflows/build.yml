name: Build HD9901 iStoreOS 24.10 - RK3399

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:

      # ==========================================
      # 1. 获取本仓库文件
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. 安装完整编译依赖
      # ==========================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pyelftools \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            ccache \
            device-tree-compiler \
            u-boot-tools \
            dosfstools \
            e2fsprogs \
            bc \
            swig \
            time \
            m4 \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libelf-dev \
            libdw-dev \
            pahole

          echo "=========================================="
          echo "Checking host tools"
          echo "=========================================="

          which gcc
          gcc --version

          which g++
          g++ --version

          which make
          make --version

          which flex
          flex --version

          which bison
          bison --version

          which m4
          m4 --version

          which dtc
          dtc --version

          python3 -c "import elftools; print('pyelftools: OK')"


      # ==========================================
      # 3. 下载 iStoreOS 24.10
      # ==========================================
      - name: Clone iStoreOS 24.10
        run: |
          git clone \
            --depth=1 \
            --branch istoreos-24.10 \
            https://github.com/istoreos/istoreos.git \
            openwrt


      # ==========================================
      # 4. 配置 iStoreOS
      # ==========================================
      - name: Configure iStoreOS
        working-directory: openwrt
        run: |

          cat > .config <<'EOF'

          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopc-t4=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y

          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          CONFIG_KERNEL_BUILD_USER="iStoreOS"
          CONFIG_KERNEL_BUILD_DOMAIN="iStoreOS"

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=256

          CONFIG_DEVEL=y

          EOF

          make defconfig


      # ==========================================
      # 5. 准备 OpenWrt Host 工具
      # ==========================================
      - name: Prepare host tools
        working-directory: openwrt
        run: |

          set -eux

          echo "=========================================="
          echo "Preparing OpenWrt host tools"
          echo "=========================================="

          mkdir -p staging_dir/host

          echo "System m4:"
          /usr/bin/m4 --version

          echo "System flex:"
          /usr/bin/flex --version

          echo "Cleaning possibly broken host m4/flex..."

          rm -f staging_dir/host/bin/m4
          rm -f staging_dir/host/bin/flex

          echo "Host tool preparation completed."


      # ==========================================
      # 6. 编译 Linux 内核和设备树
      # ==========================================
      - name: Compile Linux kernel and device trees
        working-directory: openwrt
        run: |

          set -eux

          echo "=========================================="
          echo "Building OpenWrt host tools first"
          echo "=========================================="

          make tools/compile -j2 V=s

          echo "=========================================="
          echo "Checking generated m4"
          echo "=========================================="

          if [ -f staging_dir/host/bin/m4 ]; then
            file staging_dir/host/bin/m4
            staging_dir/host/bin/m4 --version
          else
            echo "ERROR: OpenWrt m4 was not generated"
            exit 1
          fi

          echo "=========================================="
          echo "Compiling Linux kernel"
          echo "=========================================="

          make target/linux/compile -j2 V=s


      # ==========================================
      # 7. 替换 HD9901 DTB
      # ==========================================
      - name: Replace NanoPC-T4 DTB with HD9901 DTB
        working-directory: openwrt
        run: |

          set -eux

          DTB="$GITHUB_WORKSPACE/hd9901/hd9901.dtb"

          echo "=========================================="
          echo "Checking HD9901 DTB"
          echo "=========================================="

          if [ ! -f "$DTB" ]; then
            echo "ERROR: HD9901 DTB not found!"
            exit 1
          fi

          ls -lh "$DTB"
          file "$DTB"

          echo "=========================================="
          echo "Searching NanoPC-T4 DTB"
          echo "=========================================="

          FOUND=0

          while IFS= read -r f
          do

            echo "Replacing:"
            echo "$f"

            cp "$DTB" "$f"

            FOUND=1

          done < <(
            find build_dir \
              -type f \
              -name 'image-rk3399-nanopc-t4.dtb'
          )

          if [ "$FOUND" -eq 0 ]; then

            echo "ERROR: NanoPC-T4 DTB was not found!"

            echo "Available DTB files:"

            find build_dir \
              -type f \
              -name '*.dtb' \
              | head -100

            exit 1

          fi

          echo "HD9901 DTB replacement completed."
