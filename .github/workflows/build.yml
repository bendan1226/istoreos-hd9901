name: Build HD9901 iStoreOS 24.10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: HD9901 iStoreOS 24.10 Build
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ISTOREOS_BRANCH: istoreos-24.10
      BUILD_JOBS: 2

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout HD9901 repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. 检查仓库文件
      # ==========================================================
      - name: Check HD9901 files
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "HD9901 repository"
          echo "======================================"

          find hd9901 -maxdepth 1 -type f -printf '%f\n' | sort

          echo
          echo "Checking required files..."

          test -f hd9901/hd9901.dtb
          test -f hd9901/hd9901.dts
          test -f hd9901/old-boot-area.part00
          test -f hd9901/old-boot-area.part01

          echo
          echo "======================================"
          echo "DTB information"
          echo "======================================"

          file hd9901/hd9901.dtb

          echo
          echo "DTB SHA256:"
          sha256sum hd9901/hd9901.dtb

          echo
          echo "DTS SHA256:"
          sha256sum hd9901/hd9901.dts

          echo
          echo "======================================"
          echo "Boot area"
          echo "======================================"

          ls -lh \
            hd9901/old-boot-area.part00 \
            hd9901/old-boot-area.part01

          echo
          echo "======================================"
          echo "Repository status"
          echo "======================================"

          git status --short
          git log -1 --oneline

      # ==========================================================
      # 3. 安装编译环境
      # ==========================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc \
            gettext \
            git \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            libfdt-dev \
            libpython3-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            rsync \
            unzip \
            zip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ccache \
            device-tree-compiler \
            u-boot-tools \
            dosfstools \
            e2fsprogs \
            bc \
            swig \
            xsltproc \
            time \
            patch \
            perl \
            subversion \
            gperf \
            qemu-utils

      # ==========================================================
      # 4. Python tools
      # ==========================================================
      - name: Install Python tools
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m pip install \
            --upgrade \
            --user \
            setuptools \
            wheel \
            pyelftools

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          python3 -c \
            "from elftools.elf.elffile import ELFFile; print('pyelftools OK')"

      # ==========================================================
      # 5. 检查编译环境
      # ==========================================================
      - name: Check build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "CPU"
          echo "======================================"

          nproc

          echo
          echo "======================================"
          echo "Memory"
          echo "======================================"

          free -h

          echo
          echo "======================================"
          echo "Disk"
          echo "======================================"

          df -h

          echo
          echo "======================================"
          echo "Tool versions"
          echo "======================================"

          gcc --version | head -n 1
          make --version | head -n 1
          python3 --version
          dtc --version
          mkimage -V
          flex --version | head -n 1
          bison --version | head -n 1

      # ==========================================================
      # 6. Clone iStoreOS 24.10
      # ==========================================================
      - name: Clone iStoreOS 24.10
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${ISTOREOS_BRANCH}" \
            https://github.com/istoreos/istoreos.git \
            openwrt

          cd openwrt

          echo
          echo "======================================"
          echo "iStoreOS"
          echo "======================================"

          git log -1 --oneline

          echo
          echo "Branch:"
          git branch --show-current

      # ==========================================================
      # 7. 保存原始 HD9901 文件
      # ==========================================================
      - name: Backup original HD9901 files
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p hd9901-backup

          cp \
            hd9901/hd9901.dtb \
            hd9901-backup/

          cp \
            hd9901/hd9901.dts \
            hd9901-backup/

          cp \
            hd9901/old-boot-area.part00 \
            hd9901-backup/

          cp \
            hd9901/old-boot-area.part01 \
            hd9901-backup/

          cp \
            hd9901/SOURCE-HASHES.txt \
            hd9901-backup/ 2>/dev/null || true

          echo
          echo "Backup:"
          find hd9901-backup -maxdepth 1 -type f -printf '%f\n' | sort

      # ==========================================================
      # 8. 准备 HD9901 DTS
      #
      # iStoreOS 24.10 Rockchip:
      # friendlyarm_nanopc-t4
      # 默认 DTS:
      # rockchip/rk3399-nanopc-t4
      #
      # 这里在 Linux 编译之前直接使用 HD9901 DTS
      # ==========================================================
      - name: Install HD9901 DTS before kernel build
        shell: bash
        run: |
          set -euxo pipefail

          SOURCE_DTS="$GITHUB_WORKSPACE/hd9901/hd9901.dts"

          test -f "$SOURCE_DTS"

          echo "Source DTS:"
          ls -lh "$SOURCE_DTS"

          echo
          echo "Searching Rockchip DTS..."

          find openwrt/target/linux/rockchip \
            -type f \
            \( \
              -name 'rk3399-nanopc-t4.dts' \
              -o \
              -name 'rk3399-nanopc-t4.dtsi' \
            \) \
            -print

          TARGET_DTS="openwrt/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3399-nanopc-t4.dts"

          if [ ! -f "$TARGET_DTS" ]; then
            echo "ERROR: Target NanoPC-T4 DTS was not found."
            echo
            echo "Available RK3399 DTS files:"
            find openwrt/target/linux/rockchip \
              -type f \
              -name 'rk3399*.dts' \
              -print \
              | sort
            exit 1
          fi

          echo
          echo "Original DTS:"
          ls -lh "$TARGET_DTS"

          cp \
            "$TARGET_DTS" \
            "$TARGET_DTS.original"

          cp \
            "$SOURCE_DTS" \
            "$TARGET_DTS"

          echo
          echo "HD9901 DTS installed:"
          ls -lh "$TARGET_DTS"

          echo
          echo "First lines:"
          sed -n '1,40p' "$TARGET_DTS"

      # ==========================================================
      # 9. 检查 HD9901 DTS
      # ==========================================================
      - name: Validate HD9901 DTS
        shell: bash
        run: |
          set -euxo pipefail

          DTS="openwrt/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3399-nanopc-t4.dts"

          test -f "$DTS"

          echo "======================================"
          echo "HD9901 DTS validation"
          echo "======================================"

          echo
          echo "compatible:"
          grep -n \
            'compatible.*rockchip,rk3399' \
            "$DTS" \
            | head -n 10 || true

          echo
          echo "GMAC:"
          grep -n \
            'rk3399-gmac\|phy-mode.*rgmii' \
            "$DTS" \
            | head -n 20 || true

          echo
          echo "eMMC:"
          grep -n \
            'sdhci@fe330000\|mmc-hs400' \
            "$DTS" \
            | head -n 20 || true

          echo
          echo "USB:"
          grep -n \
            'fe800000\|fe900000' \
            "$DTS" \
            | head -n 20 || true

          echo
          echo "PCIe:"
          grep -n \
            'pcie@f8000000\|status.*disabled' \
            "$DTS" \
            | head -n 20 || true

          echo
          echo "DTS line count:"
          wc -l "$DTS"

      # ==========================================================
      # 10. 配置 iStoreOS
      # ==========================================================
      - name: Configure iStoreOS for RK3399
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          rm -f .config

          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopc-t4=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_IMAGES_GZIP=y

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=896

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_LUCI_LANG_zh-cn=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_ca-bundle=y

          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_pciutils=y

          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y

          CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
          CONFIG_PACKAGE_ethtool=y

          CONFIG_KERNEL_BUILD_USER="HD9901"
          CONFIG_KERNEL_BUILD_HOST="github-actions"

          EOF

          echo
          echo "======================================"
          echo "Running make defconfig"
          echo "======================================"

          make defconfig

          echo
          echo "======================================"
          echo "Final target configuration"
          echo "======================================"

          grep \
            -E \
            'CONFIG_TARGET_rockchip|CONFIG_TARGET_ROOTFS|CONFIG_TARGET_KERNEL_PARTSIZE|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_LINUX_' \
            .config \
            | sort

      # ==========================================================
      # 11. 确认设备配置
      # ==========================================================
      - name: Verify NanoPC-T4 build profile
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Target profile"
          echo "======================================"

          grep \
            'CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopc-t4' \
            .config

          echo
          echo "Expected:"
          echo "friendlyarm_nanopc-t4"
          echo
          echo "The Linux DTS has already been replaced"
          echo "with HD9901 DTS before kernel compilation."

      # ==========================================================
      # 12. OpenWrt/iStoreOS prerequisite
      # ==========================================================
      - name: Check build prerequisites
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make prereq V=s

      # ==========================================================
      # 13. 更新 feeds
      # ==========================================================
      - name: Update feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ==========================================================
      # 14. 重新生成配置
      # ==========================================================
      - name: Re-run defconfig
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make defconfig

      # ==========================================================
      # 15. 下载源码
      # ==========================================================
      - name: Download package sources
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make download \
            -j${BUILD_JOBS} \
            V=s

      # ==========================================================
      # 16. 准备 Linux kernel
      # ==========================================================
      - name: Prepare Linux kernel
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make target/linux/prepare \
            -j${BUILD_JOBS} \
            V=s

      # ==========================================================
      # 17. 检查最终 Linux DTS
      # ==========================================================
      - name: Verify final kernel DTS
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Searching final DTS"
          echo "======================================"

          find build_dir \
            -type f \
            -name 'rk3399-nanopc-t4.dts' \
            -print

          echo
          echo "Checking DTS content..."

          FOUND=0

          while IFS= read -r DTS; do
            if grep -q 'rockchip,rk3399-mid' "$DTS"; then
              echo
              echo "HD9901 DTS detected:"
              echo "$DTS"
              FOUND=1
              break
            fi
          done < <(
            find build_dir \
              -type f \
              -name 'rk3399-nanopc-t4.dts'
          )

          if [ "$FOUND" -ne 1 ]; then
            echo
            echo "ERROR: HD9901 DTS was not propagated into kernel source."
            exit 1
          fi

      # ==========================================================
      # 18. 编译 Linux kernel
      #
      # 使用 -j2，避免之前 flex/m4 高并发问题
      # ==========================================================
      - name: Compile Linux kernel
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make target/linux/compile \
            -j${BUILD_JOBS} \
            V=s

      # ==========================================================
      # 19. 检查生成的 HD9901 DTB
      # ==========================================================
      - name: Verify generated DTB
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Searching generated DTB"
          echo "======================================"

          find build_dir \
            -type f \
            -name '*.dtb' \
            -print \
            | sort

          echo
          echo "Checking NanoPC-T4 DTB..."

          mapfile -t DTBS < <(
            find build_dir \
              -type f \
              -name 'image-rk3399-nanopc-t4.dtb'
          )

          if [ "${#DTBS[@]}" -eq 0 ]; then
            echo "ERROR: image-rk3399-nanopc-t4.dtb not found!"
            exit 1
          fi

          for DTB in "${DTBS[@]}"; do

            echo
            echo "DTB:"
            echo "$DTB"

            file "$DTB"

            echo
            echo "SHA256:"
            sha256sum "$DTB"

            echo
            echo "Decompiled compatible:"
            dtc -I dtb -O dts "$DTB" 2>/dev/null \
              | grep -m 5 'compatible' \
              || true

          done

      # ==========================================================
      # 20. 完整编译
      # ==========================================================
      - name: Build iStoreOS firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make \
            -j${BUILD_JOBS} \
            V=s

      # ==========================================================
      # 21. 显示生成结果
      # ==========================================================
      - name: List firmware files
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Firmware output"
          echo "======================================"

          find openwrt/bin/targets \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

      # ==========================================================
      # 22. 创建输出目录
      # ==========================================================
      - name: Prepare output directory
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf output
          mkdir -p output

      # ==========================================================
      # 23. 找到 sysupgrade 镜像
      # ==========================================================
      - name: Find sysupgrade image
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Searching sysupgrade image"
          echo "======================================"

          find openwrt/bin/targets \
            -type f \
            \( \
              -name '*sysupgrade.img.gz' \
              -o \
              -name '*sysupgrade.tar.gz' \
            \) \
            -print

          IMG_GZ=$(
            find openwrt/bin/targets \
              -type f \
              -name '*sysupgrade.img.gz' \
              | head -n 1
          )

          if [ -z "$IMG_GZ" ]; then
            echo
            echo "ERROR: sysupgrade.img.gz not found!"
            exit 1
          fi

          echo
          echo "Selected image:"
          echo "$IMG_GZ"

          cp \
            "$IMG_GZ" \
            output/HD9901-iStoreOS-24.10-sysupgrade.img.gz

          echo "SYSUPGRADE_GZ=$IMG_GZ" >> "$GITHUB_ENV"

      # ==========================================================
      # 24. 解压 sysupgrade 镜像
      # ==========================================================
      - name: Extract sysupgrade image
        shell: bash
        run: |
          set -euxo pipefail

          gzip -dc \
            output/HD9901-iStoreOS-24.10-sysupgrade.img.gz \
            > \
            output/HD9901-iStoreOS-24.10-sysupgrade.img

          echo
          echo "Image:"
          ls -lh \
            output/HD9901-iStoreOS-24.10-sysupgrade.img

          echo
          echo "File:"
          file \
            output/HD9901-iStoreOS-24.10-sysupgrade.img

      # ==========================================================
      # 25. 保存 HD9901 DTB
      # ==========================================================
      - name: Copy HD9901 DTB
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            hd9901/hd9901.dtb \
            output/HD9901-original.dtb

      # ==========================================================
      # 26. 保存 HD9901 DTS
      # ==========================================================
      - name: Copy HD9901 DTS
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            hd9901/hd9901.dts \
            output/HD9901-original.dts

      # ==========================================================
      # 27. 保存原始 boot area
      # ==========================================================
      - name: Copy original HD9901 boot area
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            hd9901/old-boot-area.part00 \
            output/HD9901-old-boot-area.part00

          cp \
            hd9901/old-boot-area.part01 \
            output/HD9901-old-boot-area.part01

          if [ -f hd9901/SOURCE-HASHES.txt ]; then
            cp \
              hd9901/SOURCE-HASHES.txt \
              output/SOURCE-HASHES.txt
          fi

          echo
          echo "Original boot area:"
          ls -lh \
            output/HD9901-old-boot-area.part00 \
            output/HD9901-old-boot-area.part01

      # ==========================================================
      # 28. 保存编译出来的 HD9901 DTB
      # ==========================================================
      - name: Export compiled HD9901 DTB
        shell: bash
        run: |
          set -euxo pipefail

          DTB=$(
            find openwrt/build_dir \
              -type f \
              -name 'image-rk3399-nanopc-t4.dtb' \
              | head -n 1
          )

          if [ -z "$DTB" ]; then
            echo "ERROR: compiled DTB not found!"
            exit 1
          fi

          cp \
            "$DTB" \
            output/HD9901-linux-6.6.dtb

          file \
            output/HD9901-linux-6.6.dtb

          sha256sum \
            output/HD9901-linux-6.6.dtb

      # ==========================================================
      # 29. 创建 boot area 备份包
      # ==========================================================
      - name: Create boot area backup
        shell: bash
        run: |
          set -euxo pipefail

          cd output

          zip -9 \
            HD9901-original-boot-backup.zip \
            HD9901-old-boot-area.part00 \
            HD9901-old-boot-area.part01 \
            HD9901-original.dtb \
            HD9901-original.dts

      # ==========================================================
      # 30. SHA256
      # ==========================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -euxo pipefail

          cd output

          sha256sum \
            HD9901-iStoreOS-24.10-sysupgrade.img \
            > \
            HD9901-iStoreOS-24.10-sysupgrade.img.sha256

          sha256sum \
            HD9901-iStoreOS-24.10-sysupgrade.img.gz \
            > \
            HD9901-iStoreOS-24.10-sysupgrade.img.gz.sha256

          sha256sum \
            HD9901-linux-6.6.dtb \
            > \
            HD9901-linux-6.6.dtb.sha256

          echo
          echo "======================================"
          echo "SHA256"
          echo "======================================"

          cat *.sha256

      # ==========================================================
      # 31. 创建最终 ZIP
      # ==========================================================
      - name: Create HD9901 firmware ZIP
        shell: bash
        run: |
          set -euxo pipefail

          cd output

          zip -9 \
            HD9901-iStoreOS-24.10.zip \
            HD9901-iStoreOS-24.10-sysupgrade.img \
            HD9901-iStoreOS-24.10-sysupgrade.img.gz \
            HD9901-iStoreOS-24.10-sysupgrade.img.sha256 \
            HD9901-iStoreOS-24.10-sysupgrade.img.gz.sha256 \
            HD9901-linux-6.6.dtb \
            HD9901-linux-6.6.dtb.sha256 \
            HD9901-original.dtb \
            HD9901-original.dts \
            HD9901-old-boot-area.part00 \
            HD9901-old-boot-area.part01 \
            HD9901-original-boot-backup.zip \
            2>/dev/null || true

          echo
          echo "ZIP:"
          ls -lh \
            HD9901-iStoreOS-24.10.zip

      # ==========================================================
      # 32. 最终检查
      # ==========================================================
      - name: Final check
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "======================================"
          echo "HD9901 BUILD COMPLETE"
          echo "======================================"

          echo
          echo "Output files:"
          ls -lh output/

          echo
          echo "======================================"
          echo "Firmware:"
          echo "======================================"

          file \
            output/HD9901-iStoreOS-24.10-sysupgrade.img \
            output/HD9901-iStoreOS-24.10-sysupgrade.img.gz

          echo
          echo "======================================"
          echo "DTB:"
          echo "======================================"

          file \
            output/HD9901-linux-6.6.dtb

          echo
          echo "======================================"
          echo "SHA256:"
          echo "======================================"

          cat output/*.sha256

      # ==========================================================
      # 33. 上传 Actions Artifacts
      # ==========================================================
      - name: Upload HD9901 firmware
        uses: actions/upload-artifact@v4
        with:
          name: HD9901-iStoreOS-24.10
          path: output/*
          if-no-files-found: error
          retention-days: 30
