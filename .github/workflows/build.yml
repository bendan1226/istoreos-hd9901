name: Build HD9901 iStoreOS 24.10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: HD9901 iStoreOS 24.10
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ISTOREOS_BRANCH: istoreos-24.10
      BUILD_JOBS: 2

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. 检查用户仓库文件
      # ==========================================================
      - name: Check HD9901 repository
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "HD9901 files"
          echo "======================================"

          find hd9901 \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "Checking required files..."

          test -f hd9901/hd9901.dts
          test -f hd9901/hd9901.dtb
          test -f hd9901/old-boot-area.part00
          test -f hd9901/old-boot-area.part01

          echo
          echo "Original DTS:"
          ls -lh hd9901/hd9901.dts

          echo
          echo "Original DTB:"
          file hd9901/hd9901.dtb

          echo
          echo "Original DTB SHA256:"
          sha256sum hd9901/hd9901.dtb

          echo
          echo "Original boot area:"
          ls -lh \
            hd9901/old-boot-area.part00 \
            hd9901/old-boot-area.part01

      # ==========================================================
      # 3. 安装编译环境
      # ==========================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            libfdt-dev \
            libpython3-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            rsync \
            unzip \
            zip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ccache \
            device-tree-compiler \
            u-boot-tools \
            dosfstools \
            e2fsprogs \
            bc \
            swig \
            xsltproc \
            patch \
            perl \
            subversion \
            gperf \
            qemu-utils \
            time

      # ==========================================================
      # 4. Python
      # ==========================================================
      - name: Install Python tools
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m pip install \
            --upgrade \
            --user \
            setuptools \
            wheel \
            pyelftools

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          python3 -c \
            "from elftools.elf.elffile import ELFFile; print('pyelftools OK')"

      # ==========================================================
      # 5. 编译环境检查
      # ==========================================================
      - name: Check build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "CPU"
          echo "======================================"
          nproc

          echo
          echo "======================================"
          echo "MEMORY"
          echo "======================================"
          free -h

          echo
          echo "======================================"
          echo "DISK"
          echo "======================================"
          df -h

          echo
          echo "======================================"
          echo "GCC"
          echo "======================================"
          gcc --version

          echo
          echo "======================================"
          echo "MAKE"
          echo "======================================"
          make --version

          echo
          echo "======================================"
          echo "PYTHON"
          echo "======================================"
          python3 --version

          echo
          echo "======================================"
          echo "DTC"
          echo "======================================"
          dtc --version

          echo
          echo "======================================"
          echo "MKIMAGE"
          echo "======================================"
          mkimage -V

          echo
          echo "======================================"
          echo "FLEX"
          echo "======================================"
          flex --version

          echo
          echo "======================================"
          echo "BISON"
          echo "======================================"
          bison --version

      # ==========================================================
      # 6. Clone iStoreOS
      # ==========================================================
      - name: Clone iStoreOS 24.10
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${ISTOREOS_BRANCH}" \
            https://github.com/istoreos/istoreos.git \
            openwrt

          cd openwrt

          echo
          echo "======================================"
          echo "iStoreOS"
          echo "======================================"

          git log -1 --oneline

          echo
          echo "Branch:"
          git branch --show-current

      # ==========================================================
      # 7. 备份原始文件
      # ==========================================================
      - name: Backup HD9901 files
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p hd9901-backup

          cp hd9901/hd9901.dts \
            hd9901-backup/

          cp hd9901/hd9901.dtb \
            hd9901-backup/

          cp hd9901/old-boot-area.part00 \
            hd9901-backup/

          cp hd9901/old-boot-area.part01 \
            hd9901-backup/

          if [ -f hd9901/SOURCE-HASHES.txt ]; then
            cp hd9901/SOURCE-HASHES.txt \
              hd9901-backup/
          fi

      # ==========================================================
      # 8. 查找 Rockchip DTS 目录
      # ==========================================================
      - name: Locate Rockchip DTS tree
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Rockchip DTS files"
          echo "======================================"

          find openwrt/target/linux/rockchip \
            -type f \
            -name '*.dts' \
            -print \
            | sort

          echo
          echo "======================================"
          echo "DTS directory"
          echo "======================================"

          find openwrt/target/linux/rockchip \
            -type d \
            -path '*arch/arm64/boot/dts/rockchip' \
            -print

      # ==========================================================
      # 9. 创建 HD9901 DTS
      #
      # 不覆盖任何现有板子的 DTS
      # ==========================================================
      - name: Install HD9901 DTS
        shell: bash
        run: |
          set -euxo pipefail

          SOURCE_DTS="$GITHUB_WORKSPACE/hd9901/hd9901.dts"

          test -f "$SOURCE_DTS"

          DTS_DIR="openwrt/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip"

          mkdir -p "$DTS_DIR"

          TARGET_DTS="$DTS_DIR/rk3399-hd9901.dts"

          cp \
            "$SOURCE_DTS" \
            "$TARGET_DTS"

          echo
          echo "======================================"
          echo "HD9901 DTS installed"
          echo "======================================"

          ls -lh "$TARGET_DTS"

          echo
          echo "SHA256:"
          sha256sum "$TARGET_DTS"

      # ==========================================================
      # 10. 检查 DTS 内容
      # ==========================================================
      - name: Validate HD9901 DTS
        shell: bash
        run: |
          set -euxo pipefail

          DTS="openwrt/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3399-hd9901.dts"

          test -f "$DTS"

          echo "======================================"
          echo "Compatible"
          echo "======================================"

          grep -n \
            'rockchip,rk3399' \
            "$DTS" \
            || true

          echo
          echo "======================================"
          echo "GMAC"
          echo "======================================"

          grep -n \
            'rk3399-gmac\|phy-mode' \
            "$DTS" \
            || true

          echo
          echo "======================================"
          echo "eMMC"
          echo "======================================"

          grep -n \
            'sdhci@fe330000\|mmc-hs400' \
            "$DTS" \
            || true

          echo
          echo "======================================"
          echo "USB"
          echo "======================================"

          grep -n \
            'fe800000\|fe900000' \
            "$DTS" \
            || true

          echo
          echo "======================================"
          echo "WiFi"
          echo "======================================"

          grep -n \
            'ap6255\|wireless-wlan' \
            "$DTS" \
            || true

          echo
          echo "======================================"
          echo "Bluetooth"
          echo "======================================"

          grep -n \
            'wireless-bluetooth' \
            "$DTS" \
            || true

          echo
          echo "Line count:"
          wc -l "$DTS"

      # ==========================================================
      # 11. DTS 独立语法检查
      # ==========================================================
      - name: Check HD9901 DTS syntax
        shell: bash
        run: |
          set -euxo pipefail

          DTS="$GITHUB_WORKSPACE/hd9901/hd9901.dts"

          mkdir -p dts-check

          dtc \
            -I dts \
            -O dtb \
            -o dts-check/hd9901-test.dtb \
            "$DTS"

          echo
          echo "DTC generated:"
          file dts-check/hd9901-test.dtb

          echo
          echo "SHA256:"
          sha256sum dts-check/hd9901-test.dtb

      # ==========================================================
      # 12. 修改 iStoreOS Rockchip Image 定义
      #
      # 新增：
      #
      # Device/hd9901
      #
      # 基于 RK3399
      # DTS = rk3399-hd9901
      #
      # 注意：
      # iStoreOS pine64-img 强制要求 U-Boot。
      # 这里先使用 rock-pi-4-rk3399 作为临时测试 U-Boot。
      # 不代表它已经是 HD9901 最终 U-Boot。
      # ==========================================================
      - name: Add HD9901 image definition
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE_MK="openwrt/target/linux/rockchip/image/armv8.mk"

          test -f "$IMAGE_MK"

          echo "======================================"
          echo "Existing RK3399 definitions"
          echo "======================================"

          grep -n \
            'define Device/.*rk3399\|DEVICE_DTS.*rk3399' \
            "$IMAGE_MK" \
            | head -n 80 \
            || true

          echo
          echo "======================================"
          echo "Adding HD9901"
          echo "======================================"

          if grep -q \
            '^define Device/hd9901$' \
            "$IMAGE_MK"; then

            echo "HD9901 definition already exists."

          else

            cat >> "$IMAGE_MK" <<'EOF'

define Device/hd9901

$(Device/rk3399)

DEVICE_VENDOR := HD9901
DEVICE_MODEL := HD9901
DEVICE_VARIANT := RK3399

DEVICE_DTS := rk3399-hd9901

# Temporary bootloader for build/test only.
# The real HD9901 bootloader must be verified separately.
UBOOT_DEVICE_NAME := rock-pi-4-rk3399

DEVICE_PACKAGES := \
  kmod-button-hotplug \
  kmod-input-adc-keys \
  kmod-usb2 \
  kmod-usb3 \
  kmod-usb-net \
  kmod-usb-net-rtl8152 \
  kmod-gpio-button-hotplug \
  ethtool \
  usbutils \
  pciutils

endef

TARGET_DEVICES += hd9901

EOF

          fi

          echo
          echo "======================================"
          echo "HD9901 definition"
          echo "======================================"

          grep -A35 \
            '^define Device/hd9901$' \
            "$IMAGE_MK"

      # ==========================================================
      # 13. 检查 Image 定义
      # ==========================================================
      - name: Validate HD9901 image definition
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE_MK="openwrt/target/linux/rockchip/image/armv8.mk"

          grep \
            -q \
            '^define Device/hd9901$' \
            "$IMAGE_MK"

          grep \
            -q \
            'DEVICE_DTS := rk3399-hd9901' \
            "$IMAGE_MK"

          grep \
            -q \
            'UBOOT_DEVICE_NAME := rock-pi-4-rk3399' \
            "$IMAGE_MK"

          echo "HD9901 image definition OK."

      # ==========================================================
      # 14. 配置 iStoreOS
      # ==========================================================
      - name: Configure iStoreOS for HD9901
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          rm -f .config

          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_hd9901=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_IMAGES_GZIP=y

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=896

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_LUCI_LANG_zh-cn=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_ca-bundle=y

          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_pciutils=y
          CONFIG_PACKAGE_ethtool=y

          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y

          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y

          CONFIG_PACKAGE_kmod-button-hotplug=y
          CONFIG_PACKAGE_kmod-gpio-button-hotplug=y

          CONFIG_KERNEL_BUILD_USER="HD9901"
          CONFIG_KERNEL_BUILD_HOST="github-actions"

          EOF

          echo
          echo "======================================"
          echo "Running defconfig"
          echo "======================================"

          make defconfig

          echo
          echo "======================================"
          echo "HD9901 config"
          echo "======================================"

          grep \
            -E \
            'CONFIG_TARGET_rockchip|CONFIG_TARGET_ROOTFS|CONFIG_TARGET_KERNEL_PARTSIZE|CONFIG_TARGET_ROOTFS_PARTSIZE' \
            .config \
            | sort

      # ==========================================================
      # 15. 确认 HD9901 target
      # ==========================================================
      - name: Verify HD9901 target
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          grep \
            -q \
            '^CONFIG_TARGET_rockchip_armv8_DEVICE_hd9901=y$' \
            .config

          echo
          echo "HD9901 target selected successfully."

      # ==========================================================
      # 16. Prerequisite
      # ==========================================================
      - name: Check OpenWrt prerequisites
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make prereq V=s

      # ==========================================================
      # 17. Feeds
      # ==========================================================
      - name: Update feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ==========================================================
      # 18. 再次 defconfig
      # ==========================================================
      - name: Finalize configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make defconfig

          echo
          echo "Final target:"
          grep \
            '^CONFIG_TARGET_rockchip_armv8_DEVICE_hd9901=' \
            .config

      # ==========================================================
      # 19. Download
      # ==========================================================
      - name: Download sources
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make download \
            -j${BUILD_JOBS} \
            V=s

      # ==========================================================
      # 20. Prepare Linux
      # ==========================================================
      - name: Prepare Linux kernel
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make target/linux/prepare \
            -j${BUILD_JOBS} \
            V=s

      # ==========================================================
      # 21. 检查 DTS 是否进入 kernel tree
      # ==========================================================
      - name: Verify kernel DTS
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Searching HD9901 DTS"
          echo "======================================"

          find build_dir \
            -type f \
            -name 'rk3399-hd9901.dts' \
            -print

          DTS_COUNT=$(
            find build_dir \
              -type f \
              -name 'rk3399-hd9901.dts' \
              | wc -l
          )

          if [ "$DTS_COUNT" -eq 0 ]; then
            echo
            echo "ERROR: rk3399-hd9901.dts was not propagated."
            exit 1
          fi

          echo
          echo "HD9901 DTS found."

      # ==========================================================
      # 22. 编译 Linux
      # ==========================================================
      - name: Compile Linux kernel
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make target/linux/compile \
            -j${BUILD_JOBS} \
            V=s

      # ==========================================================
      # 23. 查找生成的 HD9901 DTB
      # ==========================================================
      - name: Verify generated HD9901 DTB
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Searching HD9901 DTB"
          echo "======================================"

          find build_dir \
            -type f \
            -name '*hd9901*.dtb' \
            -print

          DTB=""

          while IFS= read -r FILE; do
            DTB="$FILE"
            break
          done < <(
            find build_dir \
              -type f \
              -name 'rk3399-hd9901.dtb'
          )

          if [ -z "$DTB" ]; then
            echo
            echo "ERROR: rk3399-hd9901.dtb not generated."

            echo
            echo "All RK3399 DTBs:"
            find build_dir \
              -type f \
              -name 'rk3399*.dtb' \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "Generated DTB:"
          echo "$DTB"

          file "$DTB"

          echo
          echo "SHA256:"
          sha256sum "$DTB"

      # ==========================================================
      # 24. 完整编译
      # ==========================================================
      - name: Build iStoreOS
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          make \
            -j${BUILD_JOBS} \
            V=s

      # ==========================================================
      # 25. 显示镜像
      # ==========================================================
      - name: List firmware
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Firmware output"
          echo "======================================"

          find openwrt/bin/targets \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

      # ==========================================================
      # 26. 准备输出
      # ==========================================================
      - name: Prepare output
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf output
          mkdir -p output

      # ==========================================================
      # 27. 找到 HD9901 镜像
      # ==========================================================
      - name: Find HD9901 image
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "HD9901 images"
          echo "======================================"

          find openwrt/bin/targets \
            -type f \
            \( \
              -name '*hd9901*.img.gz' \
              -o \
              -name '*hd9901*.img' \
            \) \
            -print

          echo
          echo "All IMG.GZ files:"

          find openwrt/bin/targets \
            -type f \
            -name '*.img.gz' \
            -print

          IMG_GZ=""

          while IFS= read -r FILE; do
            IMG_GZ="$FILE"
            break
          done < <(
            find openwrt/bin/targets \
              -type f \
              -name '*hd9901*sysupgrade.img.gz'
          )

          if [ -z "$IMG_GZ" ]; then
            while IFS= read -r FILE; do
              IMG_GZ="$FILE"
              break
            done < <(
              find openwrt/bin/targets \
                -type f \
                -name '*hd9901*.img.gz'
            )
          fi

          if [ -z "$IMG_GZ" ]; then
            echo
            echo "ERROR: HD9901 image not found."

            echo
            echo "Available images:"
            find openwrt/bin/targets \
              -type f \
              -name '*.img.gz' \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "Selected:"
          echo "$IMG_GZ"

          cp \
            "$IMG_GZ" \
            output/HD9901-iStoreOS-24.10.img.gz

      # ==========================================================
      # 28. 解压镜像
      # ==========================================================
      - name: Extract HD9901 image
        shell: bash
        run: |
          set -euxo pipefail

          gzip -dc \
            output/HD9901-iStoreOS-24.10.img.gz \
            > \
            output/HD9901-iStoreOS-24.10.img

          echo
          echo "Image:"
          ls -lh \
            output/HD9901-iStoreOS-24.10.img

          echo
          echo "File:"
          file \
            output/HD9901-iStoreOS-24.10.img

      # ==========================================================
      # 29. 导出编译 DTB
      # ==========================================================
      - name: Export compiled HD9901 DTB
        shell: bash
        run: |
          set -euxo pipefail

          DTB=""

          while IFS= read -r FILE; do
            DTB="$FILE"
            break
          done < <(
            find openwrt/build_dir \
              -type f \
              -name 'rk3399-hd9901.dtb'
          )

          if [ -z "$DTB" ]; then
            echo "ERROR: HD9901 DTB not found."
            exit 1
          fi

          cp \
            "$DTB" \
            output/HD9901-linux-6.6.dtb

          file \
            output/HD9901-linux-6.6.dtb

          sha256sum \
            output/HD9901-linux-6.6.dtb

      # ==========================================================
      # 30. 保存原始 DTB/DTS
      # ==========================================================
      - name: Export original DTB and DTS
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            hd9901/hd9901.dtb \
            output/HD9901-original.dtb

          cp \
            hd9901/hd9901.dts \
            output/HD9901-original.dts

      # ==========================================================
      # 31. 保存原始 boot area
      # ==========================================================
      - name: Export original boot area
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            hd9901/old-boot-area.part00 \
            output/HD9901-old-boot-area.part00

          cp \
            hd9901/old-boot-area.part01 \
            output/HD9901-old-boot-area.part01

          if [ -f hd9901/SOURCE-HASHES.txt ]; then
            cp \
              hd9901/SOURCE-HASHES.txt \
              output/SOURCE-HASHES.txt
          fi

          echo
          echo "Original boot area:"
          ls -lh \
            output/HD9901-old-boot-area.part00 \
            output/HD9901-old-boot-area.part01

      # ==========================================================
      # 32. SHA256
      # ==========================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -euxo pipefail

          cd output

          sha256sum \
            HD9901-iStoreOS-24.10.img \
            > \
            HD9901-iStoreOS-24.10.img.sha256

          sha256sum \
            HD9901-iStoreOS-24.10.img.gz \
            > \
            HD9901-iStoreOS-24.10.img.gz.sha256

          sha256sum \
            HD9901-linux-6.6.dtb \
            > \
            HD9901-linux-6.6.dtb.sha256

          echo
          echo "======================================"
          echo "SHA256"
          echo "======================================"

          cat *.sha256

      # ==========================================================
      # 33. 创建 boot backup ZIP
      # ==========================================================
      - name: Create original boot backup ZIP
        shell: bash
        run: |
          set -euxo pipefail

          cd output

          zip -9 \
            HD9901-original-boot-backup.zip \
            HD9901-old-boot-area.part00 \
            HD9901-old-boot-area.part01 \
            HD9901-original.dtb \
            HD9901-original.dts

          if [ -f SOURCE-HASHES.txt ]; then
            zip -9 \
              HD9901-original-boot-backup.zip \
              SOURCE-HASHES.txt
          fi

      # ==========================================================
      # 34. 创建最终 ZIP
      # ==========================================================
      - name: Create final ZIP
        shell: bash
        run: |
          set -euxo pipefail

          cd output

          zip -9 \
            HD9901-iStoreOS-24.10.zip \
            HD9901-iStoreOS-24.10.img \
            HD9901-iStoreOS-24.10.img.gz \
            HD9901-iStoreOS-24.10.img.sha256 \
            HD9901-iStoreOS-24.10.img.gz.sha256 \
            HD9901-linux-6.6.dtb \
            HD9901-linux-6.6.dtb.sha256 \
            HD9901-original.dtb \
            HD9901-original.dts \
            HD9901-old-boot-area.part00 \
            HD9901-old-boot-area.part01 \
            HD9901-original-boot-backup.zip

          if [ -f SOURCE-HASHES.txt ]; then
            zip -9 \
              HD9901-iStoreOS-24.10.zip \
              SOURCE-HASHES.txt
          fi

      # ==========================================================
      # 35. 最终检查
      # ==========================================================
      - name: Final check
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "======================================"
          echo "HD9901 BUILD COMPLETE"
          echo "======================================"

          echo
          echo "Output:"
          ls -lh output/

          echo
          echo "Firmware:"
          file \
            output/HD9901-iStoreOS-24.10.img \
            output/HD9901-iStoreOS-24.10.img.gz

          echo
          echo "DTB:"
          file \
            output/HD9901-linux-6.6.dtb

          echo
          echo "SHA256:"
          cat output/*.sha256

      # ==========================================================
      # 36. 上传 Artifact
      # ==========================================================
      - name: Upload HD9901 firmware
        uses: actions/upload-artifact@v4
        with:
          name: HD9901-iStoreOS-24.10
          path: output/*
          if-no-files-found: error
          retention-days: 30
