name: Build HD9901 iStoreOS 24.10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HD9901
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:

      # =========================================================
      # 1. 拉取当前仓库
      # =========================================================
      - name: Checkout HD9901 project
        uses: actions/checkout@v4

      # =========================================================
      # 2. 检查 HD9901 专用文件
      # =========================================================
      - name: Check HD9901 files
        run: |
          set -eux

          echo "===== HD9901 files ====="
          ls -lah hd9901/

          test -f hd9901/hd9901.dtb
          test -f hd9901/old-boot-area.part00
          test -f hd9901/old-boot-area.part01

          echo "===== DTB ====="
          file hd9901/hd9901.dtb
          sha256sum hd9901/hd9901.dtb

          echo "===== boot area ====="
          ls -lh hd9901/old-boot-area.part*
          sha256sum hd9901/old-boot-area.part*

      # =========================================================
      # 3. 安装编译依赖
      # =========================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            unzip \
            zip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ccache \
            device-tree-compiler \
            u-boot-tools \
            dosfstools \
            e2fsprogs \
            bc \
            swig \
            xsltproc \
            libelf-dev

      # =========================================================
      # 4. 拉取最新版 iStoreOS 24.10
      # =========================================================
      - name: Clone iStoreOS 24.10
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch istoreos-24.10 \
            https://github.com/istoreos/istoreos.git \
            openwrt

          cd openwrt

          echo "===== iStoreOS commit ====="
          git log -1 --oneline

      # =========================================================
      # 5. 配置 RK3399 NanoPC-T4 编译目标
      # =========================================================
      - name: Configure HD9901
        working-directory: openwrt
        run: |
          set -eux

          cat > .config <<'EOF'

          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopc-t4=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_IMAGES_GZIP=y

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=896

          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_LUCI_LANG_zh-cn=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_KERNEL_BUILD_USER="HD9901"
          CONFIG_KERNEL_BUILD_HOST="github-actions"

          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_DEBUG_INFO_BTF_MODULES=y
          CONFIG_BPF_SYSCALL=y

          CONFIG_KERNEL_BPF=y
          CONFIG_KERNEL_XZ=y

          CONFIG_TARGET_INITRAMFS_COMPRESSION_XZ=y

          EOF

          make defconfig

          echo "===== Final target ====="
          grep -E \
            'CONFIG_TARGET_rockchip|CONFIG_TARGET_ROOTFS|CONFIG_TARGET_KERNEL_PARTSIZE|CONFIG_TARGET_ROOTFS_PARTSIZE' \
            .config

      # =========================================================
      # 6. 编译 Linux 内核
      # =========================================================
      - name: Compile Linux kernel
        working-directory: openwrt
        run: |
          set -eux

          make target/linux/compile \
            -j$(nproc) \
            V=s

      # =========================================================
      # 7. 查找 NanoPC-T4 DTB
      # =========================================================
      - name: Find NanoPC-T4 DTB
        working-directory: openwrt
        run: |
          set -eux

          echo "===== Searching DTB ====="

          find build_dir \
            -type f \
            \( \
              -name '*nanopc-t4*.dtb' \
              -o \
              -name 'image-rk3399-nanopc-t4.dtb' \
            \) \
            -print

      # =========================================================
      # 8. 用 HD9901 DTB 替换 NanoPC-T4 DTB
      # =========================================================
      - name: Install HD9901 DTB
        working-directory: openwrt
        run: |
          set -eux

          DTB_SOURCE="$GITHUB_WORKSPACE/hd9901/hd9901.dtb"

          test -f "$DTB_SOURCE"

          mapfile -t DTBS < <(
            find build_dir \
              -type f \
              \( \
                -name '*nanopc-t4*.dtb' \
                -o \
                -name 'image-rk3399-nanopc-t4.dtb' \
              \)
          )

          echo "Found ${#DTBS[@]} DTB files"

          test "${#DTBS[@]}" -ge 1

          for dtb in "${DTBS[@]}"; do
            echo "Replacing:"
            echo "$dtb"

            cp "$DTB_SOURCE" "$dtb"

            echo "===== Installed DTB ====="
            file "$dtb"
            sha256sum "$dtb"
          done

      # =========================================================
      # 9. 编译完整 iStoreOS
      # =========================================================
      - name: Build iStoreOS
        working-directory: openwrt
        run: |
          set -eux

          make -j$(nproc) V=s

      # =========================================================
      # 10. 显示所有生成文件
      # =========================================================
      - name: List build output
        run: |
          set -eux

          echo "===== iStoreOS output ====="

          find openwrt/bin/targets \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

      # =========================================================
      # 11. 找到最终镜像
      # =========================================================
      - name: Locate firmware image
        run: |
          set -eux

          mkdir -p output

          echo "===== Searching firmware ====="

          find openwrt/bin/targets \
            -type f \
            -name '*.img.gz' \
            -print

          IMG_GZ=$(
            find openwrt/bin/targets \
              -type f \
              -name '*sysupgrade.img.gz' \
              | head -n 1
          )

          if [ -z "$IMG_GZ" ]; then
            IMG_GZ=$(
              find openwrt/bin/targets \
                -type f \
                -name '*.img.gz' \
                | head -n 1
            )
          fi

          test -n "$IMG_GZ"

          echo "Firmware:"
          echo "$IMG_GZ"

          echo "IMG_GZ=$IMG_GZ" >> "$GITHUB_ENV"

      # =========================================================
      # 12. 解压新系统镜像
      # =========================================================
      - name: Extract firmware image
        run: |
          set -eux

          gzip -dc "$IMG_GZ" > /tmp/new.img

          echo "===== New image ====="

          ls -lh /tmp/new.img

          file /tmp/new.img

          fdisk -l /tmp/new.img || true

      # =========================================================
      # 13. 合并 HD9901 原有 boot area
      # =========================================================
      - name: Restore HD9901 boot area
        run: |
          set -eux

          echo "===== Rebuilding HD9901 boot area ====="

          cat \
            hd9901/old-boot-area.part00 \
            hd9901/old-boot-area.part01 \
            > /tmp/old-boot-area.bin

          echo "Boot area size:"
          stat -c '%s bytes' /tmp/old-boot-area.bin

          test "$(stat -c %s /tmp/old-boot-area.bin)" -eq 33554432

          cp \
            /tmp/new.img \
            output/HD9901-iStoreOS-24.10.img

          # 保留原 HD9901 已验证的 boot area
          dd \
            if=/tmp/old-boot-area.bin \
            of=output/HD9901-iStoreOS-24.10.img \
            bs=512 \
            skip=1 \
            seek=1 \
            count=65535 \
            conv=notrunc \
            status=progress

      # =========================================================
      # 14. 检查最终镜像
      # =========================================================
      - name: Check final image
        run: |
          set -eux

          echo "===== Final image ====="

          ls -lh \
            output/HD9901-iStoreOS-24.10.img

          file \
            output/HD9901-iStoreOS-24.10.img

          sha256sum \
            output/HD9901-iStoreOS-24.10.img \
            | tee \
            output/HD9901-iStoreOS-24.10.img.sha256

      # =========================================================
      # 15. 压缩
      # =========================================================
      - name: Compress firmware
        run: |
          set -eux

          gzip -9 -c \
            output/HD9901-iStoreOS-24.10.img \
            > \
            output/HD9901-iStoreOS-24.10.img.gz

          sha256sum \
            output/HD9901-iStoreOS-24.10.img.gz \
            > \
            output/HD9901-iStoreOS-24.10.img.gz.sha256

      # =========================================================
      # 16. 打包 ZIP
      # =========================================================
      - name: Create ZIP
        run: |
          set -eux

          cd output

          zip -9 \
            HD9901-iStoreOS-24.10-final.zip \
            HD9901-iStoreOS-24.10.img \
            HD9901-iStoreOS-24.10.img.gz \
            HD9901-iStoreOS-24.10.img.sha256 \
            HD9901-iStoreOS-24.10.img.gz.sha256

      # =========================================================
      # 17. 上传 GitHub Actions Artifacts
      # =========================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: HD9901-iStoreOS-24.10-final
          path: output/*
          retention-days: 30

      # =========================================================
      # 18. 输出结果
      # =========================================================
      - name: Build summary
        run: |
          echo "=========================================="
          echo " HD9901 iStoreOS 24.10 BUILD COMPLETE"
          echo "=========================================="
          echo

          ls -lh output/

          echo
          echo "SHA256:"
          cat output/*.sha256
