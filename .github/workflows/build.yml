name: Build HD9901 iStoreOS 24.10

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hd9901-istoreos-24.10
  cancel-in-progress: false

jobs:
  build:
    name: HD9901 RK3399 iStoreOS 24.10
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ISTOREOS_BRANCH: istoreos-24.10
      BUILD_JOBS: 2

    steps:

      # ============================================================
      # 1. 获取你自己的仓库
      # ============================================================
      - name: Checkout HD9901 repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. 检查仓库文件
      # ============================================================
      - name: Check repository files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Repository"
          echo "=========================================="

          pwd

          echo
          echo "Files:"
          find . -maxdepth 3 -type f | sort

          echo
          echo "Checking HD9901 files..."

          test -f hd9901/hd9901.dts
          test -f hd9901/hd9901.dtb
          test -f hd9901/old-boot-area.part00
          test -f hd9901/old-boot-area.part01

          echo
          echo "All required HD9901 files exist."

          echo
          echo "File sizes:"
          ls -lh \
            hd9901/hd9901.dts \
            hd9901/hd9901.dtb \
            hd9901/old-boot-area.part00 \
            hd9901/old-boot-area.part01

      # ============================================================
      # 3. 保存原始文件
      # ============================================================
      - name: Save original HD9901 files
        shell: bash
        run: |
          set -e

          mkdir -p original-hd9901

          cp hd9901/hd9901.dts \
            original-hd9901/

          cp hd9901/hd9901.dtb \
            original-hd9901/

          cp hd9901/old-boot-area.part00 \
            original-hd9901/

          cp hd9901/old-boot-area.part01 \
            original-hd9901/

          if [ -f hd9901/SOURCE-HASHES.txt ]; then
            cp hd9901/SOURCE-HASHES.txt \
              original-hd9901/
          fi

      # ============================================================
      # 4. 安装编译依赖
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            libfdt-dev \
            libpython3-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            rsync \
            unzip \
            zip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ccache \
            device-tree-compiler \
            u-boot-tools \
            dosfstools \
            e2fsprogs \
            bc \
            swig \
            xsltproc \
            patch \
            perl \
            gperf \
            time

      # ============================================================
      # 5. 编译环境检查
      # ============================================================
      - name: Check build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CPU"
          echo "=========================================="
          nproc

          echo
          echo "=========================================="
          echo "MEMORY"
          echo "=========================================="
          free -h

          echo
          echo "=========================================="
          echo "DISK"
          echo "=========================================="
          df -h

          echo
          echo "=========================================="
          echo "GCC"
          echo "=========================================="
          gcc --version

          echo
          echo "=========================================="
          echo "MAKE"
          echo "=========================================="
          make --version

          echo
          echo "=========================================="
          echo "PYTHON"
          echo "=========================================="
          python3 --version

          echo
          echo "=========================================="
          echo "DTC"
          echo "=========================================="
          dtc --version

          echo
          echo "=========================================="
          echo "MKIMAGE"
          echo "=========================================="
          mkimage -V

      # ============================================================
      # 6. 获取 iStoreOS 24.10
      # ============================================================
      - name: Clone iStoreOS
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch "${ISTOREOS_BRANCH}" \
            https://github.com/istoreos/istoreos.git \
            openwrt

          cd openwrt

          echo
          echo "=========================================="
          echo "iStoreOS version"
          echo "=========================================="

          git log -1 --oneline

          echo
          echo "Branch:"
          git branch --show-current

      # ============================================================
      # 7. 检查 iStoreOS Rockchip 结构
      # ============================================================
      - name: Check iStoreOS Rockchip structure
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Rockchip DTS"
          echo "=========================================="

          find openwrt/target/linux/rockchip/dts \
            -maxdepth 3 \
            -type f \
            -name '*.dts' \
            | sort

          echo
          echo "=========================================="
          echo "Rockchip image files"
          echo "=========================================="

          ls -lh \
            openwrt/target/linux/rockchip/image/

          echo
          echo "=========================================="
          echo "RK3399 devices"
          echo "=========================================="

          grep -n \
            -E \
            'Device/(friendlyarm_nanopi-r4s|radxa_rock-pi-4a|pine64_rockpro64)|DEVICE_DTS|UBOOT_DEVICE_NAME' \
            openwrt/target/linux/rockchip/image/armv8.mk \
            || true

      # ============================================================
      # 8. 安装 HD9901 DTS
      #
      # 当前 iStoreOS 24.10 Rockchip 的 RK3399 DTS 使用：
      #
      # target/linux/rockchip/dts/rk3399/
      #
      # 所以这里不再使用不存在的 NanoPC-T4 路径。
      # ============================================================
      - name: Install HD9901 DTS
        shell: bash
        run: |
          set -e

          TARGET_DIR="openwrt/target/linux/rockchip/dts/rk3399"

          mkdir -p "$TARGET_DIR"

          cp \
            hd9901/hd9901.dts \
            "$TARGET_DIR/rk3399-hd9901.dts"

          echo
          echo "Installed:"
          ls -lh \
            "$TARGET_DIR/rk3399-hd9901.dts"

          echo
          echo "SHA256:"
          sha256sum \
            "$TARGET_DIR/rk3399-hd9901.dts"

      # ============================================================
      # 9. 检查 DTS
      # ============================================================
      - name: Inspect HD9901 DTS
        shell: bash
        run: |
          set -e

          DTS="openwrt/target/linux/rockchip/dts/rk3399/rk3399-hd9901.dts"

          test -f "$DTS"

          echo "=========================================="
          echo "Root compatible"
          echo "=========================================="

          grep -n \
            'compatible' \
            "$DTS" \
            | head -n 20 \
            || true

          echo
          echo "=========================================="
          echo "RK3399 GMAC"
          echo "=========================================="

          grep -n \
            'rk3399-gmac\|phy-mode\|fe300000' \
            "$DTS" \
            || true

          echo
          echo "=========================================="
          echo "eMMC"
          echo "=========================================="

          grep -n \
            'fe330000\|mmc-hs400\|supports-emmc' \
            "$DTS" \
            || true

          echo
          echo "=========================================="
          echo "USB"
          echo "=========================================="

          grep -n \
            'fe800000\|fe900000' \
            "$DTS" \
            || true

          echo
          echo "=========================================="
          echo "WiFi"
          echo "=========================================="

          grep -n \
            'ap6255\|wireless-wlan' \
            "$DTS" \
            || true

          echo
          echo "=========================================="
          echo "PCIe"
          echo "=========================================="

          grep -n \
            'pcie@f8000000' \
            "$DTS" \
            || true

          echo
          echo "DTS size:"
          wc -c "$DTS"

      # ============================================================
      # 10. 添加 HD9901 Image Device
      #
      # 这里严格按照 iStoreOS 24.10 的 RK3399 设备写法。
      #
      # 不使用：
      # rk3399-nanopc-t4.dts
      #
      # 不使用：
      # NanoPC-T4 Device
      #
      # 使用：
      # rk3399-hd9901.dts
      #
      # U-Boot 暂时使用 iStoreOS 已有的：
      # rock-pi-4-rk3399
      #
      # 这是为了先把完整系统编译链打通。
      # ============================================================
      - name: Add HD9901 target
        shell: bash
        run: |
          set -e

          IMAGE_MK="openwrt/target/linux/rockchip/image/armv8.mk"

          cp \
            "$IMAGE_MK" \
            "$IMAGE_MK.before-hd9901"

          python3 <<'PY'
          from pathlib import Path

          p = Path("openwrt/target/linux/rockchip/image/armv8.mk")
          text = p.read_text()

          if "define Device/hd9901" in text:
              print("HD9901 device already exists.")
              raise SystemExit(0)

          block = r'''
          define Device/hd9901
            DEVICE_VENDOR := HD9901
            DEVICE_MODEL := Bozz SW799A
            DEVICE_VARIANT := RK3399

            SOC := rk3399

            DEVICE_DTS_DIR := ../dts
            DEVICE_DTS = rk3399/rk3399-hd9901

            KERNEL = kernel-bin | lzma | fit lzma $$(KDIR)/image-rk3399-hd9901.dtb

            UBOOT_DEVICE_NAME := rock-pi-4-rk3399

            DEVICE_PACKAGES := \
              kmod-brcmfmac \
              brcmfmac-nvram-4356-sdio \
              cypress-firmware-4356-sdio

          endef

          TARGET_DEVICES += hd9901

          '''

          text += "\n" + block
          p.write_text(text)

          print("HD9901 device added.")
          PY

          echo
          echo "=========================================="
          echo "HD9901 definition"
          echo "=========================================="

          grep -A30 \
            '^define Device/hd9901$' \
            "$IMAGE_MK"

      # ============================================================
      # 11. 严格检查 Device 定义
      # ============================================================
      - name: Validate HD9901 target definition
        shell: bash
        run: |
          set -e

          IMAGE_MK="openwrt/target/linux/rockchip/image/armv8.mk"

          grep -q \
            '^define Device/hd9901$' \
            "$IMAGE_MK"

          grep -q \
            'DEVICE_VENDOR := HD9901' \
            "$IMAGE_MK"

          grep -q \
            'SOC := rk3399' \
            "$IMAGE_MK"

          grep -q \
            'DEVICE_DTS_DIR := ../dts' \
            "$IMAGE_MK"

          grep -q \
            'DEVICE_DTS = rk3399/rk3399-hd9901' \
            "$IMAGE_MK"

          grep -q \
            'KERNEL = kernel-bin | lzma | fit lzma $$(KDIR)/image-rk3399-hd9901.dtb' \
            "$IMAGE_MK"

          grep -q \
            'UBOOT_DEVICE_NAME := rock-pi-4-rk3399' \
            "$IMAGE_MK"

          grep -q \
            '^TARGET_DEVICES += hd9901$' \
            "$IMAGE_MK"

          echo
          echo "HD9901 target definition is correct."

      # ============================================================
      # 12. Feeds
      # ============================================================
      - name: Update feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 13. 创建基础配置
      # ============================================================
      - name: Configure target
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          rm -f .config

          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_hd9901=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_IMAGES_GZIP=y

          CONFIG_TARGET_KERNEL_PARTSIZE=128
          CONFIG_TARGET_ROOTFS_PARTSIZE=896
          EOF

          echo
          echo "Initial config:"
          cat .config

      # ============================================================
      # 14. defconfig
      # ============================================================
      - name: Run defconfig
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          make defconfig

          echo
          echo "=========================================="
          echo "Final target"
          echo "=========================================="

          grep \
            '^CONFIG_TARGET_rockchip_armv8_DEVICE_hd9901=' \
            .config

      # ============================================================
      # 15. 确认目标真的存在
      # ============================================================
      - name: Verify target selection
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          grep -q \
            '^CONFIG_TARGET_rockchip_armv8_DEVICE_hd9901=y$' \
            .config

          echo "HD9901 target selected successfully."

      # ============================================================
      # 16. OpenWrt prereq
      # ============================================================
      - name: Check OpenWrt prerequisites
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          make prereq V=s

      # ============================================================
      # 17. 下载源码
      # ============================================================
      - name: Download sources
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          make download \
            -j${BUILD_JOBS} \
            V=s

      # ============================================================
      # 18. Prepare Linux
      # ============================================================
      - name: Prepare Linux kernel
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          make target/linux/prepare \
            -j${BUILD_JOBS} \
            V=s

      # ============================================================
      # 19. 找到真正的 Linux 6.6 DTS 目录
      # ============================================================
      - name: Locate Linux DTS directory
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          KERNEL_DTS_DIR=""

          while IFS= read -r d; do
            KERNEL_DTS_DIR="$d"
            break
          done < <(
            find build_dir \
              -type d \
              -path '*/arch/arm64/boot/dts/rockchip' \
              -print
          )

          if [ -z "$KERNEL_DTS_DIR" ]; then
            echo "ERROR: Linux Rockchip DTS directory not found."
            exit 1
          fi

          echo "$KERNEL_DTS_DIR" \
            > /tmp/hd9901-kernel-dts-dir

          echo
          echo "Linux DTS directory:"
          echo "$KERNEL_DTS_DIR"

      # ============================================================
      # 20. 把 HD9901 DTS 强制安装到 Linux 6.6 源码
      #
      # 这样即使 OpenWrt prepare 没有自动复制，
      # 这里也会确保 Linux 源码里面存在。
      # ============================================================
      - name: Install HD9901 DTS into Linux source
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          KERNEL_DTS_DIR="$(cat /tmp/hd9901-kernel-dts-dir)"

          cp \
            "$GITHUB_WORKSPACE/hd9901/hd9901.dts" \
            "$KERNEL_DTS_DIR/rk3399-hd9901.dts"

          echo
          echo "Installed:"
          ls -lh \
            "$KERNEL_DTS_DIR/rk3399-hd9901.dts"

      # ============================================================
      # 21. 注册 RK3399 HD9901 DTB
      #
      # Linux 的 Rockchip DTS Makefile 必须存在：
      #
      # dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3399-hd9901.dtb
      # ============================================================
      - name: Register HD9901 DTB
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          KERNEL_DTS_DIR="$(cat /tmp/hd9901-kernel-dts-dir)"

          MAKEFILE="$KERNEL_DTS_DIR/Makefile"

          test -f "$MAKEFILE"

          if grep -q \
            'rk3399-hd9901.dtb' \
            "$MAKEFILE"; then

            echo "HD9901 DTB already registered."

          else

            printf '\n' >> "$MAKEFILE"
            printf '%s\n' \
              'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3399-hd9901.dtb' \
              >> "$MAKEFILE"

            echo "HD9901 DTB registered."

          fi

          echo
          echo "Registration:"
          grep \
            -n \
            'rk3399-hd9901.dtb' \
            "$MAKEFILE"

      # ============================================================
      # 22. 检查 Linux DTS
      # ============================================================
      - name: Verify Linux DTS
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          KERNEL_DTS_DIR="$(cat /tmp/hd9901-kernel-dts-dir)"

          DTS="$KERNEL_DTS_DIR/rk3399-hd9901.dts"

          test -f "$DTS"

          grep -q \
            'rockchip,rk3399' \
            "$DTS"

          grep -q \
            'rk3399-gmac' \
            "$DTS"

          grep -q \
            'fe330000' \
            "$DTS"

          echo
          echo "HD9901 Linux DTS verified."

      # ============================================================
      # 23. 编译 Linux
      # ============================================================
      - name: Compile Linux kernel
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          make target/linux/compile \
            -j${BUILD_JOBS} \
            V=s

      # ============================================================
      # 24. 确认 DTB
      # ============================================================
      - name: Verify HD9901 DTB
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          DTB=""

          while IFS= read -r f; do
            DTB="$f"
            break
          done < <(
            find build_dir \
              -type f \
              -name 'rk3399-hd9901.dtb' \
              -print
          )

          if [ -z "$DTB" ]; then

            echo
            echo "=========================================="
            echo "ERROR: HD9901 DTB was NOT generated"
            echo "=========================================="

            echo
            echo "Available RK3399 DTBs:"

            find build_dir \
              -type f \
              -name 'rk3399*.dtb' \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "HD9901 DTB:"
          echo "$DTB"

          file "$DTB"

          echo
          echo "SHA256:"
          sha256sum "$DTB"

      # ============================================================
      # 25. 完整编译
      # ============================================================
      - name: Build iStoreOS
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          make \
            -j${BUILD_JOBS} \
            V=s

      # ============================================================
      # 26. 查找固件
      # ============================================================
      - name: Find firmware
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Firmware files"
          echo "=========================================="

          find openwrt/bin/targets \
            -type f \
            | sort

      # ============================================================
      # 27. 准备 Artifact
      # ============================================================
      - name: Prepare artifacts
        shell: bash
        run: |
          set -e

          rm -rf output
          mkdir -p output

      # ============================================================
      # 28. 复制 HD9901 镜像
      # ============================================================
      - name: Collect firmware
        shell: bash
        run: |
          set -e

          IMG=""

          while IFS= read -r f; do
            IMG="$f"
            break
          done < <(
            find openwrt/bin/targets \
              -type f \
              -name 'istoreos-rockchip-armv8-hd9901-squashfs-sysupgrade.img.gz'
          )

          if [ -z "$IMG" ]; then

            echo "Exact filename not found."

            echo
            echo "Available sysupgrade images:"

            find openwrt/bin/targets \
              -type f \
              -name '*sysupgrade*.img.gz' \
              -print \
              | sort

            exit 1
          fi

          cp \
            "$IMG" \
            output/HD9901-iStoreOS-24.10-sysupgrade.img.gz

          echo
          echo "Selected image:"
          echo "$IMG"

      # ============================================================
      # 29. 保存编译 DTB
      # ============================================================
      - name: Collect DTB
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          DTB=""

          while IFS= read -r f; do
            DTB="$f"
            break
          done < <(
            find build_dir \
              -type f \
              -name 'rk3399-hd9901.dtb' \
              -print
          )

          test -n "$DTB"

          cp \
            "$DTB" \
            "$GITHUB_WORKSPACE/output/HD9901-linux-6.6.dtb"

      # ============================================================
      # 30. 保存原始 DTS/DTB
      # ============================================================
      - name: Collect original DTS and DTB
        shell: bash
        run: |
          set -e

          cp \
            hd9901/hd9901.dts \
            output/HD9901-original.dts

          cp \
            hd9901/hd9901.dtb \
            output/HD9901-original.dtb

      # ============================================================
      # 31. 保存旧 boot area
      # ============================================================
      - name: Collect original boot area
        shell: bash
        run: |
          set -e

          cp \
            hd9901/old-boot-area.part00 \
            output/HD9901-old-boot-area.part00

          cp \
            hd9901/old-boot-area.part01 \
            output/HD9901-old-boot-area.part01

          if [ -f hd9901/SOURCE-HASHES.txt ]; then
            cp \
              hd9901/SOURCE-HASHES.txt \
              output/SOURCE-HASHES.txt
          fi

      # ============================================================
      # 32. 解压镜像检查
      # ============================================================
      - name: Inspect firmware image
        shell: bash
        run: |
          set -e

          gzip -dc \
            output/HD9901-iStoreOS-24.10-sysupgrade.img.gz \
            > \
            output/HD9901-iStoreOS-24.10-sysupgrade.img

          echo
          echo "Image size:"
          ls -lh \
            output/HD9901-iStoreOS-24.10-sysupgrade.img

          echo
          echo "File type:"
          file \
            output/HD9901-iStoreOS-24.10-sysupgrade.img

      # ============================================================
      # 33. 镜像分区检查
      # ============================================================
      - name: Check image partition table
        shell: bash
        run: |
          set -e

          IMG="output/HD9901-iStoreOS-24.10-sysupgrade.img"

          echo "=========================================="
          echo "fdisk"
          echo "=========================================="

          sudo fdisk -l "$IMG" \
            || true

          echo
          echo "=========================================="
          echo "parted"
          echo "=========================================="

          sudo parted \
            -s \
            "$IMG" \
            unit MiB \
            print \
            || true

      # ============================================================
      # 34. SHA256
      # ============================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -e

          cd output

          sha256sum \
            HD9901-iStoreOS-24.10-sysupgrade.img.gz \
            > \
            HD9901-iStoreOS-24.10-sysupgrade.img.gz.sha256

          sha256sum \
            HD9901-iStoreOS-24.10-sysupgrade.img \
            > \
            HD9901-iStoreOS-24.10-sysupgrade.img.sha256

          sha256sum \
            HD9901-linux-6.6.dtb \
            > \
            HD9901-linux-6.6.dtb.sha256

          sha256sum \
            HD9901-original.dtb \
            > \
            HD9901-original.dtb.sha256

          echo
          echo "=========================================="
          echo "SHA256"
          echo "=========================================="

          cat *.sha256

      # ============================================================
      # 35. 创建原始 boot 备份
      # ============================================================
      - name: Create original boot backup
        shell: bash
        run: |
          set -e

          cd output

          zip -9 \
            HD9901-original-boot-backup.zip \
            HD9901-old-boot-area.part00 \
            HD9901-old-boot-area.part01 \
            HD9901-original.dtb \
            HD9901-original.dts

          if [ -f SOURCE-HASHES.txt ]; then
            zip -9 \
              HD9901-original-boot-backup.zip \
              SOURCE-HASHES.txt
          fi

      # ============================================================
      # 36. 创建完整固件 ZIP
      # ============================================================
      - name: Create HD9901 firmware ZIP
        shell: bash
        run: |
          set -e

          cd output

          zip -9 \
            HD9901-iStoreOS-24.10.zip \
            HD9901-iStoreOS-24.10-sysupgrade.img.gz \
            HD9901-iStoreOS-24.10-sysupgrade.img \
            HD9901-iStoreOS-24.10-sysupgrade.img.gz.sha256 \
            HD9901-iStoreOS-24.10-sysupgrade.img.sha256 \
            HD9901-linux-6.6.dtb \
            HD9901-linux-6.6.dtb.sha256 \
            HD9901-original.dtb \
            HD9901-original.dtb.sha256 \
            HD9901-original.dts \
            HD9901-old-boot-area.part00 \
            HD9901-old-boot-area.part01 \
            HD9901-original-boot-backup.zip

          if [ -f SOURCE-HASHES.txt ]; then
            zip -9 \
              HD9901-iStoreOS-24.10.zip \
